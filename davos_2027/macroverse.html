<script>
// ---- the macroverse. Every finished play of veri+as is one youniverse. Each one is tied to the few plays most like it, measured
// the way the mirror measures you, and the ties pull them into clusters and filaments, the way galaxies gather. Nothing here
// sorts anyone into a type: whatever shape there is appears after the fact, from the plays alone.
// Far off, a youniverse is a point of light. Near, it is its fingerprint: its seven stars, flat, joined in the order found.
// Opened, the fingerprint folds, like paper, into the sky it lifted into at the end of its play, ringed by its culture.
// It only reads: the public study record on the relays, and the youniverses kept on this device. It sends nothing.
(() => {
'use strict';
const params = new URLSearchParams(location.search);
const DEMO = Math.max(0, Math.min(3000, parseInt(params.get('demo') || '0', 10) || 0));   // ?demo=N: a made-up macroverse to look at

const meaningOf = (name) => { const t = String(name).toLowerCase().split(/[ _]/), n = NOUN_EN[t[0]], v = PART_EN[t[1]], h = t[2] ? HOUR_EN[t[2]] : '';

// ---- what each measure is, and where it usually sits (the piece's own guesses: base and scale)
const SAL = [
  { k:'longest', w:['Manens','Fugiens'], base:5, scale:6 }, { k:'stay', w:['Morans','Transiens'], base:1.2, scale:2 },
  { k:'letgo', w:['Quaerens',null], base:1, scale:1.5 }, { k:'direct', w:['Videns','Errans'], base:0.6, scale:0.18 },

  { k:'stir', w:['Agitans','Tacens'], base:4, scale:6 }, { k:'wiped', w:['Tangens',null], base:0.5, scale:2.5 },
  { k:'together', w:['Socians',null], base:0, scale:1 }, { k:'hull', w:['Amplectens','Tenens'], base:0.18, scale:0.08 },
  { k:'cross', w:['Rediens',null], base:1, scale:1.5 }, { k:'closure', w:[null,'Revertens'], base:0.6, scale:0.25 },

const SHAPE = new Set(['hull', 'sectors', 'turn', 'cross', 'closure']);   // these are read from the constellation itself

// the shape of a constellation, measured exactly as the mirror measures it
function shapeOf(pts){
  const n = pts.length;
  const sectors = new Set(pts.map((p) => Math.floor(((Math.atan2(p[1], p[0]) + Math.PI)/(2*Math.PI))*8) % 8)).size;
  let turn = 0, turns = 0;
  for (let i = 1; i+1 < n; i++) {
    const a1 = Math.atan2(pts[i][1]-pts[i-1][1], pts[i][0]-pts[i-1][0]), a2 = Math.atan2(pts[i+1][1]-pts[i][1], pts[i+1][0]-pts[i][0]);

  }
  const ccw = (A, B, C) => (C[1]-A[1])*(B[0]-A[0]) > (B[1]-A[1])*(C[0]-A[0]);
  let cross = 0;
  for (let i = 0; i+1 < n; i++) for (let j = i+2; j+1 < n; j++) if (ccw(pts[i], pts[j], pts[j+1]) !== ccw(pts[i+1], pts[j], pts[j+1]) && ccw(pts[i], pts[i+1], pts[j]) !== ccw(pts[i], pts[i+1], pts[j+1])) cross++;

  if (n >= 3) {
    const q = pts.slice().sort((a, b) => a[0]-b[0] || a[1]-b[1]), cr = (o, a, b) => (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
    const lo = [], up = [];
    for (const p of q) { while (lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
    for (const p of q.slice().reverse()) { while (up.length >= 2 && cr(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }

    for (let i = 0; i < h.length; i++) { const a = h[i], b = h[(i+1) % h.length]; hull += a[0]*b[1]-b[0]*a[1]; }

// a youniverse as a list of numbers: how far each measure sits from usual, in its own units. Missing ones sit at usual.
function vectorOf(f, path){
  const sh = path && path.length >= 3 ? shapeOf(path) : null, v = new Float32Array(SAL.length);
  SAL.forEach((s, i) => {
    const raw = SHAPE.has(s.k) && sh ? sh[s.k] : f ? f[s.k] : undefined, x = +raw;

}
const distOf = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) { const e = a[i]-b[i]; s += e*e; } return Math.sqrt(s); };
// how far into it the play went: every form of life found, the minutes, being seen, the riddles
function depthOf(f){
  if (!f) return 0.3;
  const finds = clamp((+f.finds || 0)/LINES, 0, 1), mins = clamp((+f.minutes || 0)/12, 0, 1), you = (+f.you || 0) > 0 ? 1 : 0;

  return clamp(0.35*finds + 0.3*Math.sqrt(mins) + 0.2*you + 0.15*more, 0, 1);
}

// ---- chance, fixed by a name: the same play is always the same star
const hashStr = (s) => { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
