<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veri+as · ii</title>
<meta name="description" content="A sink that has been draining since September. By January there will be nothing in it but lace. Hold, and it is still.">
<style>
  :root { --bone:#e4dfd2; --gold:#c2a27a; --ink:#030304; --dim:#8a8d93;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; overflow:hidden; background:var(--ink); color:var(--dim); font:12.5px/1.75 var(--mono); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:none; }
  /* the words are plumbed into the basin: a line runs from the tap to the title */
  #lead { position:fixed; left:0; top:0; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; cursor:pointer; }
  #lead:focus-visible { outline:1px solid var(--gold); }
  #words { position:fixed; left:0; top:0; width:300px; pointer-events:none; opacity:.9;
    text-shadow:0 0 18px rgba(228,223,210,.30), 0 0 3px rgba(3,3,4,.9); }
  h1 { margin:0; font:400 24px/1.1 var(--mono); letter-spacing:.42em; text-transform:uppercase; color:var(--bone); }
  h1 i { font-style:normal; color:var(--gold); }
  pre { margin:20px 0 0; font:inherit; }
  pre span { display:block; min-height:1.75em; }
  .slot { display:inline-block; width:.62em; height:1.05em; vertical-align:-.18em; background:var(--gold); animation:blink 1.6s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  /* read all eight and the poem gives way to the outline */
  #outline { display:none; margin:18px 0 0; font-size:11.5px; line-height:1.6; color:var(--bone); }
  #outline h2 { margin:8px 0 0; font:400 10px/1.6 var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
  #outline p { margin:0; }
  body.whole pre { display:none; }
  body.whole #outline { display:block; }
  #sign { display:none; margin:14px 0 0; align-items:center; gap:14px; color:var(--bone); font-size:11.5px; line-height:1.6; }
  body.whole #sign { display:flex; }
  body.whole #say { display:none; }
  #sign svg { width:64px; height:64px; flex:none; fill:var(--bone); stroke:var(--bone); stroke-width:.9; stroke-linejoin:round; }
  #sign svg path { fill:none; }
  #sign a { color:var(--gold); pointer-events:auto; }
  pre { transition:opacity .8s; }
  body.held pre { opacity:.22; }
  /* one line at a time. It arrives as script and resolves into words while you hold. */
  #say { margin:16px 0 0; height:6.2em; color:var(--bone); white-space:pre-wrap; }
  #say b { display:block; font:400 10px/1.75 var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
  #say.quiet { color:var(--dim); font-size:11px; letter-spacing:.3em; text-transform:uppercase; padding-top:1.9em; }
  /* the ask: one line, once. Nothing happens without the click. */
  pre b { font-weight:400; color:var(--dim); }
  #bio { margin-top:14px; }
  #bio .how { color:#5a5e64; font-size:11px; }
  .knob { color:var(--gold) !important; pointer-events:auto; cursor:ew-resize; border-bottom:1px dotted var(--gold); user-select:none; }
  .knob:focus-visible { outline:none; border-bottom-style:solid; }
  /* the eye: the drain is a button once it has started looking at you. Its words show when you come near. */
  #eye { position:fixed; left:0; top:0; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; display:none; cursor:pointer; }
  #eye.on { display:block; }
  #ask { position:absolute; left:52px; top:50%; transform:translateY(-50%); margin:0; white-space:nowrap; font-size:11.5px; color:var(--bone);
    opacity:0; transition:opacity .6s; pointer-events:none; text-shadow:0 0 2px #030304, 0 0 6px #030304, 0 0 14px #030304; }
  #eye:hover #ask, #eye:focus-visible #ask, #eye.said #ask { opacity:1; }
  #ask b { font-weight:400; color:var(--gold); }
  #err { display:none; color:var(--bone); margin:18px 0 0; }
  @media (prefers-reduced-motion: reduce) { .slot { animation:none; } pre { transition:none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="A dark basin seen from above, under fluted glass, ringed with lace. Faces, skulls and flowers melt toward the drain and return from the tap."></canvas>
<a id="lead" href="proposal.html" title="the proposal" aria-label="The full proposal"></a>
<button id="eye" type="button" aria-label="Let it see you: one frame from your camera, never sent"><span id="ask"><b>look back</b> &middot; one frame, never sent</span></button>
<main id="words">
  <h1>veri<i>+</i>as</h1>
<pre aria-label="Poem, running"><span>sink = drain(sink)</span><span>n -&gt; &infin;<b id="pN"></b><b id="pT" hidden></b></span><span>sink == sync<b id="pS">   // 0.00</b></span><span>// macrofluidic &times; <i class="slot" aria-label="an open place"></i></span></pre>
<pre id="bio" aria-label="The biology, live"><span>culture(f=<b class="knob" data-k="f" tabindex="0">0.0390</b>, k=<b class="knob" data-k="k" tabindex="0">0.0580</b>)</span></pre>
  <div id="outline"></div>
  <p id="sign"></p>
  <p id="say" class="quiet" aria-live="polite">hold</p>
  <div id="err"></div>
</main>

<script>
(() => {
'use strict';
const FRAMES = [/*FRAMES*/];      // eight stills, in loop order, inlined by build.py

const canvas = document.getElementById('c');
const words = document.getElementById('words');
const say = document.getElementById('say');
const errBox = document.getElementById('err');
const fail = (m) => { errBox.textContent = m; errBox.style.display = 'block'; };

const gl = canvas.getContext('webgl2', { alpha:false, antialias:false, depth:false, stencil:false, preserveDrawingBuffer:false });
if (!gl) { fail('This needs WebGL2, which this browser did not provide.'); return; }
if (!gl.getExtension('EXT_color_buffer_float')) { fail('This needs float render targets (EXT_color_buffer_float).'); return; }
if (!FRAMES.length) { fail('No images were built into this file. Run build.py.'); return; }

// ---- geometry of the sink, in sim UV (0..1), shared by every shader ----
const SIM = 256, DYE = 1024, PIPE_N = 256;
const COMMON = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
out vec4 o;
const vec2  C   = vec2(0.5);
const float R   = 0.395;   // basin wall
const float RD  = 0.030;   // drain
const float SF  = 0.034;   // tap footprint
const float SD  = 0.030;   // drain footprint
float wall(vec2 p){ return 1.0 - smoothstep(R-0.004, R, length(p-C)); }
bool inside(vec2 p){ return length(p-C) < R; }
`;

// the image that is being poured: the current still, dissolving into the next
const IMG_FN = `
uniform vec2 uRot;                                     // the basin is turned: cos, sin
uniform sampler2D uImgA, uImgB;
uniform float uMix;
vec2 rot(vec2 v){ return vec2(uRot.x*v.x-uRot.y*v.y, uRot.y*v.x+uRot.x*v.y); }      // screen -> basin
vec2 unrot(vec2 v){ return vec2(uRot.x*v.x+uRot.y*v.y, -uRot.y*v.x+uRot.x*v.y); }   // basin -> screen
vec3 img(vec2 p){
  vec2 g = unrot(p-C)/(2.*R)+0.5;                      // upright for the viewer
  return pow(mix(texture(uImgA,g).rgb, texture(uImgB,g).rgb, uMix), vec3(2.2));
}`;

// what you see when you hold: this moment of the loop, grown through with another,
// each cropped, turned and mirrored by chance. It is composed once, at the press, and never again.
const STILL_FN = `
uniform sampler2D uImgP;
uniform vec4 uPA, uPB;                                 // zoom, offset x, offset y, turn
uniform vec2 uPFlip; uniform float uPSeed;
float h2(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(h2(i),h2(i+vec2(1,0)),f.x), mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x), f.y); }
vec2 xf(vec2 g, vec4 t, float flip){
  g -= 0.5; g.x *= flip;
  float c = cos(t.w), s = sin(t.w);
  return vec2(c*g.x-s*g.y, s*g.x+c*g.y)/t.x + t.yz + 0.5;
}
vec3 still(vec2 p){
  vec2 g = unrot(p-C)/(2.*R)+0.5;
  vec2 ga = xf(g, uPA, uPFlip.x);
  vec3 a = pow(mix(texture(uImgA,ga).rgb, texture(uImgB,ga).rgb, uMix), vec3(2.2));
  vec3 b = pow(texture(uImgP, xf(g, uPB, uPFlip.y)).rgb, vec3(2.2));
  float m = 0.55*n2(g*2.1+uPSeed) + 0.30*n2(g*4.7-uPSeed) + 0.15*n2(g*11.+uPSeed*2.);
  m = smoothstep(0.40,0.60,m);
  return mix(mix(a,b,m), max(a,b), 0.30);
}`;

const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

const FS = {
curl: `
uniform sampler2D uVel; uniform float uH;
void main(){
  float L = texture(uVel, vUv-vec2(uH,0.)).y, Rr = texture(uVel, vUv+vec2(uH,0.)).y;
  float B = texture(uVel, vUv-vec2(0.,uH)).x, T  = texture(uVel, vUv+vec2(0.,uH)).x;
  o = vec4(((Rr-L)-(T-B))*0.5/uH, 0.,0.,1.);
}`,

// body forces: vorticity confinement, the drain's turn, and the hand stirring
force: `
uniform sampler2D uVel, uCurl;
uniform float uH, uDt, uConf, uGamma, uRelax;
uniform vec2 uStirPos, uStirVel;
void main(){
  vec2 v = texture(uVel, vUv).xy;
  float cL = texture(uCurl, vUv-vec2(uH,0.)).x, cR = texture(uCurl, vUv+vec2(uH,0.)).x;
  float cB = texture(uCurl, vUv-vec2(0.,uH)).x, cT = texture(uCurl, vUv+vec2(0.,uH)).x;
  float cC = texture(uCurl, vUv).x;
  vec2 f = 0.5*vec2(abs(cT)-abs(cB), abs(cR)-abs(cL));
  f /= length(f)+1e-4; f *= uConf*cC; f.y *= -1.;
  v += f*uDt;
  vec2 d = vUv-C; float r2 = dot(d,d); float r = sqrt(r2)+1e-5;
  vec2 th = vec2(-d.y, d.x)/r;
  v += th*(uGamma*r/(r2+0.0036)-dot(v,th))*(1.-exp(-uRelax*uDt));
  vec2 s = vUv-uStirPos;
  v += uStirVel*exp(-dot(s,s)/0.0022);
  o = vec4(v*wall(vUv),0.,1.);
}`,

advect: `
uniform sampler2D uVel, uSrc; uniform float uDt, uDiss;
void main(){
  vec2 p = vUv - uDt*texture(uVel, vUv).xy;
  o = texture(uSrc, p)*exp(-uDiss*uDt)*wall(vUv);
}`,

// divergence minus what the tap adds and the drain removes
diverge: `
uniform sampler2D uVel; uniform float uH, uQ; uniform vec2 uTap;
void main(){
  float L = texture(uVel, vUv-vec2(uH,0.)).x, Rr = texture(uVel, vUv+vec2(uH,0.)).x;
  float B = texture(uVel, vUv-vec2(0.,uH)).y, T  = texture(uVel, vUv+vec2(0.,uH)).y;
  float div = ((Rr-L)+(T-B))*0.5/uH;
  vec2 a = vUv-uTap, b = vUv-C;
  float src = uQ/(3.14159*SF*SF)*exp(-dot(a,a)/(SF*SF))
            - uQ/(3.14159*SD*SD)*exp(-dot(b,b)/(SD*SD));
  o = vec4(div-src,0.,0.,1.);
}`,

pressure: `
uniform sampler2D uP, uDiv; uniform float uH;
void main(){
  float pC = texture(uP, vUv).x;
  vec2 l=vUv-vec2(uH,0.), r=vUv+vec2(uH,0.), b=vUv-vec2(0.,uH), t=vUv+vec2(0.,uH);
  float pL = inside(l)?texture(uP,l).x:pC, pR = inside(r)?texture(uP,r).x:pC;
  float pB = inside(b)?texture(uP,b).x:pC, pT = inside(t)?texture(uP,t).x:pC;
  o = vec4((pL+pR+pB+pT - uH*uH*texture(uDiv,vUv).x)*0.25,0.,0.,1.);
}`,

project: `
uniform sampler2D uP, uVel; uniform float uH;
void main(){
  float pC = texture(uP, vUv).x;
  vec2 l=vUv-vec2(uH,0.), r=vUv+vec2(uH,0.), b=vUv-vec2(0.,uH), t=vUv+vec2(0.,uH);
  float pL = inside(l)?texture(uP,l).x:pC, pR = inside(r)?texture(uP,r).x:pC;
  float pB = inside(b)?texture(uP,b).x:pC, pT = inside(t)?texture(uP,t).x:pC;
  vec2 v = texture(uVel, vUv).xy - vec2(pR-pL, pT-pB)*0.5/uH;
  o = vec4(v*wall(vUv),0.,1.);
}`,

// the picture is the pigment: it is carried by the flow, and keeps re-forming out of the still
dye: `
uniform sampler2D uVel, uDye, uRet;
uniform float uDt, uPour, uFade, uSlot, uRetGain;
uniform vec2 uTap;
${IMG_FN}
const float RET_N = 256.;
void main(){
  vec2 p = vUv - uDt*texture(uVel, vUv).xy;
  vec4 d = texture(uDye, p);
  d.rgb *= exp(-uFade*uDt);
  // the still is poured in once, at its beginning; then it is left to the loop
  float keep = smoothstep(RD, 0.15, length(vUv-C));
  d.rgb = mix(d.rgb, img(vUv)*1.1, (1.-exp(-uPour*uDt))*keep);
  // what comes out of the tap is a copy of what went down the drain a while ago: a copy of a copy of a copy
  vec2 a = vUv-uTap;
  float g = smoothstep(SF*1.7, SF*0.5, length(a));
  vec2 cuv = clamp(a/(SF*1.7)*0.5+0.5, 0., 1.);
  vec3 back = texture(uRet, vec2(cuv.x, (uSlot+cuv.y)/RET_N)).rgb*uRetGain;
  d.rgb = mix(d.rgb, back, g*(1.-exp(-5.*uDt)));
  o = d*wall(vUv);
}`,

// the drain takes a small picture of what is going down it. 256 of them, in turn, are the loop's memory.
crop: `
uniform sampler2D uDye;
void main(){ o = vec4(texture(uDye, C+(vUv-0.5)*0.15).rgb, 1.); }`,

// the lace: two chemicals, one feeding on the other (Gray-Scott). x is the way round the rim, y is outward.
// Near the rim it grows as a net with holes; further out it breaks into cells that divide.
lace: `
uniform sampler2D uRD; uniform vec2 uTx; uniform float uTime, uSeed, uDf, uDk; uniform vec3 uTouch;
float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
void main(){
  vec2 c = texture(uRD, vUv).rg;
  vec2 e = vec2(uTx.x,0.), n = vec2(0.,uTx.y);
  vec2 lap = -c + 0.13*(texture(uRD,vUv+e).rg + texture(uRD,vUv-e).rg) + 0.27*(texture(uRD,vUv+n).rg + texture(uRD,vUv-n).rg)
           + 0.05*(texture(uRD,vUv+e+n).rg + texture(uRD,vUv+e-n).rg + texture(uRD,vUv-e+n).rg + texture(uRD,vUv-e-n).rg);
  float a = vUv.x*6.28318;
  float f = mix(0.0390, 0.0367, vUv.y) + uDf + 0.0018*sin(a*3.+uTime*0.05) + 0.0012*sin(a*7.-uTime*0.031) + 0.0010*sin(vUv.y*9.-uTime*0.08);
  float k = mix(0.0580, 0.0649, vUv.y) + uDk + 0.0006*sin(a*2.-uTime*0.017+1.);
  float r = c.r*c.g*c.g;
  vec2 v = c + vec2(lap.r - r + f*(1.-c.r), 0.5*lap.g + r - (f+k)*c.g);
  // on the beat the rim seeds it again, somewhere; a hand passing through clears it, and it grows back
  float sd = step(0.994, hash(vec2(floor(vUv.x*440.), uSeed)))*step(vUv.y,0.06);
  v.g = max(v.g, sd*0.45);
  float ev = floor(uTime*0.5);                                          // a patch dies every two seconds, somewhere
  vec2 pc = vec2(hash(vec2(ev,1.7)), 0.15+0.7*hash(vec2(ev,9.2)));
  vec2 dp = vec2(min(abs(vUv.x-pc.x), 1.-abs(vUv.x-pc.x))*6., vUv.y-pc.y);
  float age = fract(uTime*0.5);
  v = mix(v, vec2(1.,0.), 0.6*exp(-dot(dp,dp)/0.0025)*smoothstep(0.,0.15,age)*smoothstep(0.6,0.3,age));
  // and the whole culture creeps outward, a little, all the time
  v = mix(v, texture(uRD, vUv-vec2(0., uTx.y*0.35)).rg, 0.06);
  vec2 dt = vec2(min(abs(vUv.x-uTouch.x), 1.-abs(vUv.x-uTouch.x))*6., vUv.y-uTouch.y);
  float wipe = uTouch.z*exp(-dot(dt,dt)/0.002);
  v = mix(v, vec2(1.,0.), wipe);
  o = vec4(clamp(v,0.,1.),0.,1.);
}`,

// what is going down the drain right now
display: `
uniform sampler2D uDye, uRD;
uniform float uTime, uBeats, uS, uHold, uSurge, uCursorOn, uDpr, uHeldSecs, uLoss, uEnd, uJelly, uWaltz;
uniform float uRead, uWhole, uFlash, uDepth, uFocus, uGaze;
uniform vec4 uWords;                                  // the words' box, in pixels
uniform vec2 uSpot;                                   // where the glass is clear, this hold
uniform vec2 uPath[8]; uniform float uPathN, uGrow;   // the places you have found, in order: your path; the last still arriving
uniform vec2 uOther[8]; uniform float uOtherN;        // a path someone else found, if they sent it
uniform vec2 uLead;                                   // where the line from the tap arrives
uniform vec2 uTap, uCenter, uRes, uCursor;
${IMG_FN}
${STILL_FN}
float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
float hash1(float n){ return fract(sin(n*127.1+3.7)*43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}
float fbm(vec2 p){ float a = 0.5, v = 0.; for(int i=0;i<4;i++){ v += a*vnoise(p); p = p*2.03+17.; a *= 0.5; } return v; }
float seg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; return length(pa-ba*clamp(dot(pa,ba)/dot(ba,ba),0.,1.)); }
float lum(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }
float bit(float n, float k){ return step(1., mod(floor(n/k),2.)); }
// lub-dub
float beat(float ph){
  ph = fract(ph);
  float a = ph/0.10, a2 = (ph-1.)/0.10, b = (ph-0.30)/0.11;
  return exp(-a*a)+exp(-a2*a2)+0.6*exp(-b*b);
}
const vec3 BONE = vec3(0.95,0.91,0.82);
const vec3 GOLD = vec3(0.62,0.40,0.20);
const float LACE0 = 0.006, LACE1 = 0.24;   // the lace begins just off the rim and runs this far out
const float NR = 58.;      // flutes per basin unit

void main(){
  vec2 q = (gl_FragCoord.xy-uCenter)/uS;     // screen-aligned, in basin units, origin at the drain
  vec2 d = rot(q);                           // the same point in the basin's own turned frame
  float r = length(q);
  float aa = 1.5/uS;
  vec3 col = vec3(0.0012,0.0012,0.0015);
  // the lace parts round the words: a clearing with soft edges, so they sit in the piece, not beside it
  vec2 wc = 0.5*(uWords.xy+uWords.zw), wh = 0.5*(uWords.zw-uWords.xy);
  float rad = min(wh.x, wh.y)*0.9;
  vec2 dd = abs(gl_FragCoord.xy-wc)-(wh-rad);
  float sd = length(max(dd,0.))+min(max(dd.x,dd.y),0.)-rad;
  sd += (fbm(q*2.6+vec2(uTime*0.03,-uTime*0.02))-0.5)*0.06*uRes.y;
  float clear = mix(0.18, 1., smoothstep(-0.02*uRes.y, 0.13*uRes.y, sd));
  clear = mix(1., clear, smoothstep(R+0.01, R+0.10, r));

  // corona: lace grown on the rim. Threads follow the edges of the culture; signals run out along them on the beat.
  if(r > R-0.09-0.40*uEnd){                                              // the culture reaches in over the picture; at the end, all the way
    float rr = r-R;
    vec2 dir = q/r;
    vec2 lp = vec2(atan(q.y,q.x)/6.28318+0.5+uTime*0.0022, (abs(rr)-LACE0)/(LACE1*(1.+0.06*uWaltz)));   // it turns, it breathes; inside the rim it is its own mirror
    float v = texture(uRD, lp).g;
    vec2 gv = vec2(texture(uRD, lp+vec2(0.0006,0.)).g-texture(uRD, lp-vec2(0.0006,0.)).g, texture(uRD, lp+vec2(0.,0.01)).g-texture(uRD, lp-vec2(0.,0.01)).g);
    vec2 tn = normalize(gv+1e-5);                                           // across the thread, in lace space
    vec2 sn = normalize(vec2(-dir.y, dir.x)*tn.x + dir*tn.y);              // the same, on screen
    float relief = 0.55+0.45*dot(sn, normalize(vec2(-0.6, 0.8)));          // lit from the upper left
    float w = fwidth(v)*1.9+0.018;
    float thread = (1.-smoothstep(0.,w,abs(v-0.20))) + 0.6*(1.-smoothstep(0.,w,abs(v-0.31)));
    float body = smoothstep(0.16,0.34,v);
    float glint = smoothstep(0.78,1.,vnoise(q*330.+vec2(uTime*0.35,-uTime*0.22)))*smoothstep(0.6,1.,vnoise(q*41.-uTime*0.06));
    float pulse = 0.5+0.5*cos(6.28318*(uBeats*0.5-rr*1.2));                     // a slow swell that moves outward, never a flash
    float signal = smoothstep(0.78,1.,vnoise(vec2(lp.x*60., rr*8.-uBeats*0.35)));   // something travelling outward, faint

// ---- state ----
const H = 1/SIM;
const TAP = [0.5, 0.5+0.27];

const BEAT_SECONDS = 1.6;             // ~38 bpm: a freediver's heart on a breath-hold
const SIGN_BEATS = 9;                 // each still has nine heartbeats
const READ_SECONDS = 1.6;             // one heartbeat kept in the clear place
const HOLD_AFTER = 220;               // ms: shorter is a tap, longer is a hold

function grade(cx){                 // the same grade as the stills: cool mono, a little gold in the light, dark at the edges

// ---- one composition. Wide: the disc is cropped by the left edge and the words stand to its right.
// Tall: the disc is cropped by the top and the words stand under it. Either way the tap is turned to face them.
const RING = 0.470/0.395;             // the ring of cuts, in basin radii
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  const ww = Math.min(300, w-48), wh = words.offsetHeight;
  let Rb, cx, cy, wx, wy;
  if (w > 1.3*h) {
    Rb = 0.47*h; cy = 0.54*h;
    cx = Math.min(0.40*w, w-ww-40-RING*Rb-36);
    wx = cx+RING*Rb+36; wy = Math.max(0.12*h, cy-0.62*Rb-wh/2);
  } else {
    Rb = Math.min(0.47*w, (h-wh-70)/(RING+0.92));
    cx = 0.46*w; cy = 0.92*Rb;
    wx = Math.max(24, Math.min(w-ww-24, cx-0.35*Rb)); wy = cy+RING*Rb+52;
  }
  words.style.width = ww+'px';
  words.style.transform = `translate(${Math.round(wx)}px,${Math.round(wy)}px)`;
  const lead = [wx-14, wy+13];                       // just left of the title's first letter
  document.getElementById('lead').style.transform = `translate(${Math.round(lead[0])}px,${Math.round(lead[1])}px)`;
  document.getElementById('eye').style.transform = `translate(${Math.round(cx)}px,${Math.round(cy)}px)`;
  const turn = Math.atan2(lead[0]-cx, cy-lead[1]);
  ROT[0] = Math.cos(turn); ROT[1] = Math.sin(turn);

  Object.assign(view, { w, h, cx, cy, S:Rb/0.395, dpr, box:[wx-10, wy-6, wx+ww, wy+wh+6], lead });
  const pw = Math.max(2, Math.round(w*dpr)), ph = Math.max(2, Math.round(h*dpr));
  if (canvas.width !== pw || canvas.height !== ph || !scene) {
    canvas.width = pw; canvas.height = ph;
    for (const t of [scene, softA, softB]) if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); }
    scene = sheet(pw, ph);
    softA = sheet(Math.ceil(pw/4), Math.ceil(ph/4)); softB = sheet(softA.w, softA.h);

}

  let want = 0;

    if (!pause.done) {
      pause.kept = focus > 0.8 ? pause.kept+dt : Math.max(0, pause.kept-dt*0.6);
      if (pause.kept >= READ_SECONDS) { pause.done = true; flash = 1; if (pause.line >= 0) { mark(pause.spot); reveal(pause.line); } }
    }
  }
  focus += (want-focus)*(1-Math.exp(-dt/0.22));
  intro = Math.max(0, intro-dt);
  growT = Math.min(1, growT + dt/2.2);
  gaze += (((asked && !faceTex) ? 1 : 0)-gaze)*(1-Math.exp(-dt/1.5));   // it starts looking once it is ready to be looked at
  if (!asked && end === 0 && (read.some(Boolean) || simTime > 40) && navigator.mediaDevices) { asked = true; eye.classList.add('on'); }
  if (meet > 0) { meet -= dt; if (meet <= 0) facePour = 1.8; }      // after the meeting, the pour
  const showStill = held || intro > 0 || ghost.on || meet > 0;
  holdAmt += ((showStill ? 1 : 0)-holdAmt)*(1-Math.exp(-dt/0.8));
  if (intro > 0 || meet > 0) focus = 1;
  // the glass as a spring
  jelly.v += ((hand.pressing ? 1 : 0)-jelly.x)*30*dt - jelly.v*6*dt; jelly.x += jelly.v*dt;
  // attract: after eight untouched seconds a ghost ring drifts to the clear place and closes there
  idle = hand.on || held ? 0 : idle+dt;
  if (!ghost.on && idle > 8 && intro <= 0 && !read.some(Boolean)) { ghost.on = true; ghost.t = 0; }
  if (ghost.on) { ghost.t += dt; if (ghost.t > 7 || hand.on || held) ghost.on = false; }
  depth += ((held ? 1-Math.exp(-heldSecs/9) : 0)-depth)*(1-Math.exp(-dt/0.5));
  whole += ((read.every(Boolean) ? 1 : 0)-whole)*(1-Math.exp(-dt/2.5));
  if (whole > 0.5) end = Math.min(1, end + dt/25);          // and then the drain takes the rest
  flash *= Math.exp(-dt/1.8);
  tell(now);
  const t0 = performance.now();
  render();
  if (probe) {   // ?probe: force the GPU to finish, keep the timings, and let a test drive the clock
    gl.readPixels(0,0,1,1, gl.RGBA, gl.UNSIGNED_BYTE, drainRGBA);
    probe.push(performance.now()-t0); if (probe.length > 120) probe.shift();
    window.__veritas = { ms:probe, tick, pause, view, read, loss, get end(){ return end; }, get held(){ return held; }, get holdAmt(){ return holdAmt; }, get whole(){ return whole; }, get simTime(){ return simTime; },
      dyeAt(x, y){ const px = new Float32Array(4); gl.bindFramebuffer(gl.FRAMEBUFFER, dye.read.fbo); gl.readPixels(Math.floor(x*DYE), Math.floor(y*DYE), 1, 1, gl.RGBA, gl.FLOAT, px); return Array.from(px); },
      get fadeNow(){ return 0.03 + 0.20*loss + 2.5*end; } };
  }
}

// ---- hands: move stirs, a tap turns the page, a hold is stillness ----
const toBasin = (ev) => {
  const b = canvas.getBoundingClientRect();
  hand.x = ev.clientX-b.left; hand.y = ev.clientY-b.top;
  const qx = (hand.x-view.cx)/view.S, qy = (view.cy-hand.y)/view.S;
  return [0.5+ROT[0]*qx-ROT[1]*qy, 0.5+ROT[1]*qx+ROT[0]*qy];
};
canvas.addEventListener('pointermove', (ev) => {
  const [x, y] = toBasin(ev); hand.on = true;
  if (stir.px !== null) {
    const k = 4.0, cap = 0.6;                       // the picture is a paste: it goes where the hand pushes it
    stir.vx += Math.max(-cap, Math.min(cap, (x-stir.px)*k));
    stir.vy += Math.max(-cap, Math.min(cap, (y-stir.py)*k));
  }
  stir.x = x; stir.y = y; stir.px = x; stir.py = y;
  const qx = (hand.x-view.cx)/view.S, qy = (view.cy-hand.y)/view.S, rr = Math.hypot(qx, qy)-0.395;
  if (rr > 0 && rr < 0.26) { touch.x = Math.atan2(qy, qx)/(2*Math.PI)+0.5; touch.y = (rr-0.006)/0.24; touch.z = 0.5; }
});
canvas.addEventListener('pointerleave', () => { stir.px = stir.py = null; if (!hand.pressing) hand.on = false; });

canvas.addEventListener('pointerdown', (ev) => {
  toBasin(ev); hand.on = true; hand.pressing = true;
  try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
  clearTimeout(hand.timer);
  hand.timer = setTimeout(() => { if (hand.pressing) setHeld(true); }, HOLD_AFTER);
});
canvas.addEventListener('pointerup', (ev) => {
  if (!hand.pressing) return;
  hand.pressing = false; clearTimeout(hand.timer);
  if (held) setHeld(false); else turnPage();
  if (ev.pointerType !== 'mouse') hand.on = false;
});
canvas.addEventListener('pointercancel', () => { hand.pressing = false; hand.on = false; clearTimeout(hand.timer); if (held) setHeld(false); });
canvas.addEventListener('contextmenu', (ev) => ev.preventDefault());

// the still for this hold: a partner from somewhere else in the loop, and a chance framing for each
function compose(){
  const rnd = (a, b) => a + Math.random()*(b-a);
  const frame = (zMax, turn) => { const z = rnd(1, zMax), m = (1-1/z)/2; return [z, rnd(-m, m), rnd(-m, m), rnd(-turn, turn)]; };
  pause.p = (sign + 3 + Math.floor(Math.random()*(N-6))) % N;
  pause.A = frame(1.25, 0.12); pause.B = frame(1.9, 0.6);
  pause.face = faceHolds > 0; if (pause.face) { faceHolds--; pause.B = frame(1.15, 0.08); pause.flip = [1, 1]; }
  pause.flip = [1, Math.random() < 0.5 ? -1 : 1];
  pause.seed = rnd(0, 60);
  // the clear place: anywhere in the basin but the drain, and not where the hand already is
  const hx = (hand.x-view.cx)/view.S, hy = (view.cy-hand.y)/view.S;
  for (let n = 0; n < 24; n++) {
    const a = rnd(0, 2*Math.PI), rad = rnd(0.10, 0.31);
    pause.spot = [rad*Math.cos(a), rad*Math.sin(a)];
    if (Math.hypot(pause.spot[0]-hx, pause.spot[1]-hy) > 0.18) break;
  }
  pause.line = read.indexOf(false); pause.kept = 0; pause.done = false;
}

function turnPage(){          // begin dissolving into the next image now
  const gT = beats/SIGN_BEATS, gph = gT-Math.floor(gT);
  if (gph < 0.72) beats = (Math.floor(gT)+0.72)*SIGN_BEATS;
}
function setHeld(v){
  if (v === held) return;
  held = v;
  if (v) {
    holdStart = performance.now(); heldSecs = 0;
    compose();
  }
  else { surge = 1; pause.byKey = false; }
  document.body.classList.toggle('held', v);
}
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) { setHeld(true); pause.byKey = true; } }   // with no hand to seek with, the place finds you
  else if (e.code === 'ArrowRight') turnPage();
  else if (e.key === 'r' && !e.metaKey && !e.ctrlKey) record(15);
});
window.addEventListener('keyup', (e) => { if (e.code === 'Space') setHeld(false); });
window.addEventListener('blur', () => { hand.pressing = false; clearTimeout(hand.timer); setHeld(false); });

// r: keep fifteen seconds of the basin as a clip
let recording = false;
function record(seconds){
  if (recording || !canvas.captureStream || !window.MediaRecorder) return;
  const type = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  if (!type) return;
  recording = true;
  const chunks = [], rec = new MediaRecorder(canvas.captureStream(60), { mimeType:type, videoBitsPerSecond:16e6 });
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = 'veritas.' + (type.includes('mp4') ? 'mp4' : 'webm');
    a.click(); recording = false;
  };
  rec.start(); setTimeout(() => rec.stop(), seconds*1000);
}

// ---- begin, once the stills are in ----
Promise.all(FRAMES.map((src) => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; })))
.then((ims) => {
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  imgTex = ims.map((im) => { const t = texture(gl.LINEAR); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, im); return t; });
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  const params = new URLSearchParams(location.search);
  other.push(...decodePath(params.get('p') || ''));      // a path someone sent: it is already in the basin when you arrive
  restore();                                              // and what you left here last time is still here
  const preroll = Math.min(600, Math.max(0, parseFloat(params.get('t') ?? '6') || 0));
  grow(2600);                                   // let the lace establish itself before anyone sees it
  for (let i = 0; i < preroll*30; i++) step(1/30);
  compose();
  last = performance.now();
  resize();
  requestAnimationFrame(frame);
})
.catch(() => fail('The images did not load.'));
})();
</script>
</body>
