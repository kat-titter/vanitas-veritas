<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veri+as · ii</title>
<meta name="description" content="A sink that has been draining since September. By January there will be nothing in it but lace. Hold, and it is still.">
<style>
  :root { --bone:#e4dfd2; --gold:#c2a27a; --ink:#030304; --dim:#8a8d93;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; overflow:hidden; background:var(--ink); color:var(--dim); font:12.5px/1.75 var(--mono); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:none; }
  /* the words are plumbed into the basin: a line runs from the tap to the title */
  #lead { position:fixed; left:0; top:0; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; cursor:pointer; display:none; }
  body.sky #lead { display:block; }
  #outline .door { display:none; }
  body.sky #outline .door { display:inline; }
  /* the sky, counted: one glyph per lit star, a space between plays, nothing about what is left */
  /* the sky, counted: a thin line that fills. No number: how much is left is not told. */
  #prog { margin:12px 0 0; min-height:1.75em; display:flex; align-items:center; gap:8px; }
  #prog .bar { display:inline-block; width:150px; height:1px; background:#26282d; position:relative; }
  #prog .bar i { position:absolute; left:0; top:-1px; height:3px; width:0; background:var(--gold); transition:width 1.4s; }
  #prog .dot { display:none; width:5px; height:5px; border-radius:50%; background:var(--bone); box-shadow:0 0 8px var(--bone); }
  body.nova #prog .dot { display:inline-block; }
  /* the credit: two letters to find. */
  #we { width:2.6ch; margin:0; padding:0 0 1px; background:none; border:0; border-bottom:1px solid var(--gold); color:var(--gold);
    font:inherit; font-weight:700; letter-spacing:.3em; pointer-events:auto; outline:none; caret-color:var(--gold); border-radius:0; }
  #we::placeholder { color:var(--gold); opacity:1; font-weight:700; animation:blink 1.6s steps(1) infinite; }
  #we:focus::placeholder { animation:none; opacity:.35; }
  body.we #we { border-bottom-color:transparent; color:var(--gold); pointer-events:none; }
  #we.no { animation:no .5s; }
  @keyframes no { 25% { transform:translateX(-3px); } 75% { transform:translateX(3px); } }
  /* a way back to the beginning */
  #tools { margin:12px 0 0; font-size:10px; letter-spacing:.22em; text-transform:uppercase; }
  #tools a { color:#5a5e64; pointer-events:auto; text-decoration:none; border-bottom:1px dotted #3a3d44; }
  #tools a:hover, #tools a:focus-visible { color:var(--dim); }
  #lead:focus-visible { outline:1px solid var(--gold); }
  #words { position:fixed; left:0; top:0; width:300px; pointer-events:none; opacity:.9; visibility:hidden;
    text-shadow:0 0 18px rgba(228,223,210,.30), 0 0 3px rgba(3,3,4,.9); }
  h1 { margin:0; font:400 24px/1.1 var(--mono); letter-spacing:.42em; text-transform:uppercase; color:var(--bone); }
  h1 i { font-style:normal; color:var(--gold); }
  pre { margin:20px 0 0; font:inherit; }
  pre span { display:block; min-height:1.75em; }
  .slot { display:inline-block; width:.62em; height:1.05em; vertical-align:-.18em; background:var(--gold); animation:blink 1.6s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  /* read all eight and the poem gives way to the outline */
  #outline { margin:14px 0 0; font-size:11.5px; line-height:1.6; color:var(--bone); }
  #outline:empty { display:none; }
  #outline h2 { margin:8px 0 0; font:400 10px/1.6 var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
  #sign { display:none; margin:14px 0 0; align-items:center; gap:14px; color:var(--bone); font-size:11.5px; line-height:1.6; }
  body.whole #sign { display:flex; }
  body.whole #say { display:none; }
  #sign a { color:var(--gold); pointer-events:auto; }
  pre { transition:opacity .8s; }
  body.held pre { opacity:.22; }
  /* one line at a time. It arrives as script and resolves into words while you hold. */
  #say { margin:16px 0 0; height:6.2em; color:var(--bone); white-space:pre-wrap; }
  #say b { display:block; font:400 10px/1.75 var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
  #say code, #outline code { font:inherit; color:var(--gold); white-space:pre-wrap; }
  #say .c, #outline .c { display:block; color:var(--bone); white-space:pre-wrap; }
  #outline p { margin:0 0 8px; }
  #outline p { margin:0 0 6px; }
  #outline .head { color:var(--dim); margin-bottom:10px; }
  #say.quiet { color:var(--dim); font-size:11px; letter-spacing:.3em; text-transform:uppercase; padding-top:1.9em; }
  /* the ask: one line, once. Nothing happens without the click. */
  pre b { font-weight:400; color:var(--dim); }
  #bio { margin-top:14px; }
  #bio .how { color:#5a5e64; font-size:11px; }
  .knob { color:var(--gold) !important; pointer-events:auto; cursor:ew-resize; border-bottom:1px dotted var(--gold); user-select:none; }
  .knob:focus-visible { outline:none; border-bottom-style:solid; }
  /* the eye: the drain is a button once it has started looking at you. Its words show when you come near. */
  #eye { position:fixed; left:0; top:0; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; display:none; cursor:pointer; }
  #eye.on { display:block; }
  #ask { position:absolute; left:52px; top:50%; transform:translateY(-50%); margin:0; white-space:nowrap; font-size:11.5px; color:var(--bone);
    opacity:0; transition:opacity .6s; pointer-events:none; text-shadow:0 0 2px #030304, 0 0 6px #030304, 0 0 14px #030304; }
  #eye:hover #ask, #eye:focus-visible #ask, #eye.said #ask { opacity:1; }
  #ask b { font-weight:400; color:var(--gold); }
  #err { display:none; color:var(--bone); margin:18px 0 0; }
  /* the sky: one star per line read. Each play lights its own constellation; a lit star remembers its still and its line. */
  #sky { position:fixed; left:0; top:0; pointer-events:none; }
  .star { position:fixed; left:0; top:0; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; border:0; padding:0;
    background:none; display:none; cursor:none; pointer-events:auto; }
  .star.on { display:block; }
  .star:focus-visible { outline:1px dotted var(--gold); }
  .clue { position:fixed; left:0; top:0; margin:0; font:400 10px/1.6 var(--mono); letter-spacing:.22em; text-transform:uppercase;
    color:var(--gold); opacity:0; transition:opacity 2.5s; pointer-events:none; text-align:center; }
  .clue.narrow { font-size:8.5px; line-height:1.45; letter-spacing:.14em; }
  .clue.on.show { opacity:.85; }
  @media (prefers-reduced-motion: reduce) { .slot { animation:none; } pre { transition:none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="A dark basin seen from above, under fluted glass, ringed with lace. Faces, skulls and flowers melt toward the drain and return from the tap."></canvas>
<a id="lead" href="proposal.html" title="the proposal" aria-label="The full proposal"></a>
<button id="eye" type="button" aria-label="Let it see you: one frame from your camera, never sent"><span id="ask"><b>look back</b> &middot; one frame, never sent</span></button>
<div id="sky" aria-label="The sky: one star for every line read"></div>
<main id="words">
  <h1>veri<i>+</i>as</h1>
<pre aria-label="Poem, running"><span>sink = drain(sink)</span><span>n -&gt; &infin;<b id="pN"></b><b id="pT" hidden></b></span><span>sink == sync<b id="pS"></b></span><span>// macrofluidic &times; <input id="we" maxlength="2" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="__" aria-label="two letters"></span></pre>
<pre id="bio" aria-label="The biology, live"><span>culture(f=<b class="knob" data-k="f" tabindex="0">0.0390</b>, k=<b class="knob" data-k="k" tabindex="0">0.0580</b>)</span></pre>
  <p id="prog" aria-label="How much of the sky is lit"><span class="bar"><i></i></span><i class="dot" aria-label="the viewer"></i></p>
  <div id="outline"></div>
  <p id="sign"></p>
  <p id="say" class="quiet" aria-live="polite">hold</p>
  <div id="err"></div>
  <p id="tools"><a href="?reset" id="reset">reset</a></p>
</main>

<script>
(() => {
'use strict';
const FRAMES = [/*FRAMES*/];      // eight stills, in loop order, inlined by build.py

const canvas = document.getElementById('c');
const words = document.getElementById('words');
const say = document.getElementById('say');
const errBox = document.getElementById('err');
const fail = (m) => { errBox.textContent = m; errBox.style.display = 'block'; };

const gl = canvas.getContext('webgl2', { alpha:false, antialias:false, depth:false, stencil:false, preserveDrawingBuffer:false });
if (!gl) { fail('This needs WebGL2, which this browser did not provide.'); return; }
if (!gl.getExtension('EXT_color_buffer_float')) { fail('This needs float render targets (EXT_color_buffer_float).'); return; }
if (!FRAMES.length) { fail('No images were built into this file. Run build.py.'); return; }

// ---- geometry of the sink, in sim UV (0..1), shared by every shader ----
const SIM = 256, DYE = 1280, PIPE_N = 256;
const COMMON = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
out vec4 o;
const vec2  C   = vec2(0.5);
const float R   = 0.395;   // basin wall
const float RD  = 0.030;   // drain
const float SF  = 0.034;   // tap footprint
const float SD  = 0.030;   // drain footprint
float wall(vec2 p){ return 1.0 - smoothstep(R-0.004, R, length(p-C)); }
bool inside(vec2 p){ return length(p-C) < R; }
`;

// the image that is being poured: the current still, dissolving into the next
const IMG_FN = `
uniform vec2 uRot;                                     // the basin is turned: cos, sin
uniform sampler2D uImgA, uImgB;
uniform float uMix;
vec2 rot(vec2 v){ return vec2(uRot.x*v.x-uRot.y*v.y, uRot.y*v.x+uRot.x*v.y); }      // screen -> basin
vec2 unrot(vec2 v){ return vec2(uRot.x*v.x+uRot.y*v.y, -uRot.y*v.x+uRot.x*v.y); }   // basin -> screen
vec3 img(vec2 p){
  vec2 g = unrot(p-C)/(2.*R)+0.5;                      // upright for the viewer
  return pow(mix(texture(uImgA,g).rgb, texture(uImgB,g).rgb, uMix), vec3(2.2));
}`;

// what you see when you hold: this moment of the loop, grown through with another,
// each cropped, turned and mirrored by chance. It is composed once, at the press, and never again.
const STILL_FN = `
uniform sampler2D uImgP;
uniform vec4 uPA, uPB;                                 // zoom, offset x, offset y, turn
uniform vec2 uPFlip; uniform float uPSeed;
float h2(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(h2(i),h2(i+vec2(1,0)),f.x), mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x), f.y); }
vec2 xf(vec2 g, vec4 t, float flip){
  g -= 0.5; g.x *= flip;
  float c = cos(t.w), s = sin(t.w);
  return vec2(c*g.x-s*g.y, s*g.x+c*g.y)/t.x + t.yz + 0.5;
}
vec3 still(vec2 p){
  vec2 g = unrot(p-C)/(2.*R)+0.5;
  vec2 ga = xf(g, uPA, uPFlip.x);
  vec3 a = pow(mix(texture(uImgA,ga).rgb, texture(uImgB,ga).rgb, uMix), vec3(2.2));
  vec3 b = pow(texture(uImgP, xf(g, uPB, uPFlip.y)).rgb, vec3(2.2));
  float m = 0.55*n2(g*2.1+uPSeed) + 0.30*n2(g*4.7-uPSeed) + 0.15*n2(g*11.+uPSeed*2.);
  m = smoothstep(0.40,0.60,m);
  return mix(mix(a,b,m), max(a,b), 0.30);
}`;

const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

const FS = {
curl: `
uniform sampler2D uVel; uniform float uH;
void main(){
  float L = texture(uVel, vUv-vec2(uH,0.)).y, Rr = texture(uVel, vUv+vec2(uH,0.)).y;
  float B = texture(uVel, vUv-vec2(0.,uH)).x, T  = texture(uVel, vUv+vec2(0.,uH)).x;
  o = vec4(((Rr-L)-(T-B))*0.5/uH, 0.,0.,1.);
}`,

// body forces: vorticity confinement, the drain's turn, and the hand stirring
force: `
uniform sampler2D uVel, uCurl;
uniform float uH, uDt, uConf, uGamma, uRelax;
uniform vec2 uStirPos, uStirVel;
uniform vec3 uWell[24]; uniform float uWellN;         // the stars' gravity: where each line was found, the water turns (x, y, strength with sign)
void main(){
  vec2 v = texture(uVel, vUv).xy;
  float cL = texture(uCurl, vUv-vec2(uH,0.)).x, cR = texture(uCurl, vUv+vec2(uH,0.)).x;
  float cB = texture(uCurl, vUv-vec2(0.,uH)).x, cT = texture(uCurl, vUv+vec2(0.,uH)).x;
  float cC = texture(uCurl, vUv).x;
  vec2 f = 0.5*vec2(abs(cT)-abs(cB), abs(cR)-abs(cL));
  f /= length(f)+1e-4; f *= uConf*cC; f.y *= -1.;
  v += f*uDt;
  vec2 d = vUv-C; float r2 = dot(d,d); float r = sqrt(r2)+1e-5;
  vec2 th = vec2(-d.y, d.x)/r;
  v += th*(uGamma*r/(r2+0.0036)-dot(v,th))*(1.-exp(-uRelax*uDt));
  for(int i=0;i<24;i++){
    if(float(i) >= uWellN) break;
    vec2 e = vUv-uWell[i].xy; float e2 = dot(e,e); float er = sqrt(e2)+1e-5;
    vec2 te = vec2(-e.y, e.x)/er;
    v += te*(uWell[i].z*er/(e2+0.0016)-dot(v,te))*(1.-exp(-0.5*uDt))*smoothstep(0.09,0.03,er);
  }
  vec2 s = vUv-uStirPos;
  v += uStirVel*exp(-dot(s,s)/0.0022);
  o = vec4(v*wall(vUv),0.,1.);
}`,

advect: `
uniform sampler2D uVel, uSrc; uniform float uDt, uDiss;
void main(){
  vec2 p = vUv - uDt*texture(uVel, vUv).xy;
  o = texture(uSrc, p)*exp(-uDiss*uDt)*wall(vUv);
}`,

// divergence minus what the tap adds and the drain removes
diverge: `
uniform sampler2D uVel; uniform float uH, uQ; uniform vec2 uTap;
void main(){
  float L = texture(uVel, vUv-vec2(uH,0.)).x, Rr = texture(uVel, vUv+vec2(uH,0.)).x;
  float B = texture(uVel, vUv-vec2(0.,uH)).y, T  = texture(uVel, vUv+vec2(0.,uH)).y;
  float div = ((Rr-L)+(T-B))*0.5/uH;
  vec2 a = vUv-uTap, b = vUv-C;
  float src = uQ/(3.14159*SF*SF)*exp(-dot(a,a)/(SF*SF))
            - uQ/(3.14159*SD*SD)*exp(-dot(b,b)/(SD*SD));
  o = vec4(div-src,0.,0.,1.);
}`,

pressure: `
uniform sampler2D uP, uDiv; uniform float uH;
void main(){
  float pC = texture(uP, vUv).x;
  vec2 l=vUv-vec2(uH,0.), r=vUv+vec2(uH,0.), b=vUv-vec2(0.,uH), t=vUv+vec2(0.,uH);
  float pL = inside(l)?texture(uP,l).x:pC, pR = inside(r)?texture(uP,r).x:pC;
  float pB = inside(b)?texture(uP,b).x:pC, pT = inside(t)?texture(uP,t).x:pC;
  o = vec4((pL+pR+pB+pT - uH*uH*texture(uDiv,vUv).x)*0.25,0.,0.,1.);
}`,

project: `
uniform sampler2D uP, uVel; uniform float uH;
void main(){
  float pC = texture(uP, vUv).x;
  vec2 l=vUv-vec2(uH,0.), r=vUv+vec2(uH,0.), b=vUv-vec2(0.,uH), t=vUv+vec2(0.,uH);
  float pL = inside(l)?texture(uP,l).x:pC, pR = inside(r)?texture(uP,r).x:pC;
  float pB = inside(b)?texture(uP,b).x:pC, pT = inside(t)?texture(uP,t).x:pC;
  vec2 v = texture(uVel, vUv).xy - vec2(pR-pL, pT-pB)*0.5/uH;
  o = vec4(v*wall(vUv),0.,1.);
}`,

// the picture is the pigment: it is carried by the flow, and keeps re-forming out of the still
dye: `
uniform sampler2D uVel, uDye, uRet;
uniform float uDt, uPour, uFade, uSlot, uRetGain;
uniform vec2 uTap;
${IMG_FN}
const float RET_N = 256.;
void main(){
  vec2 p = vUv - uDt*texture(uVel, vUv).xy;
  vec4 d = texture(uDye, p);
  d.rgb *= exp(-uFade*uDt);
  // the still is poured in once, at its beginning; then it is left to the loop
  float keep = smoothstep(RD, 0.15, length(vUv-C));
  d.rgb = mix(d.rgb, img(vUv)*1.1, (1.-exp(-uPour*uDt))*keep);
  // what comes out of the tap is a copy of what went down the drain a while ago: a copy of a copy of a copy
  vec2 a = vUv-uTap;
  float g = smoothstep(SF*1.7, SF*0.5, length(a));
  vec2 cuv = clamp(a/(SF*1.7)*0.5+0.5, 0., 1.);
  vec3 back = texture(uRet, vec2(cuv.x, (uSlot+cuv.y)/RET_N)).rgb*uRetGain;
  d.rgb = mix(d.rgb, back, g*(1.-exp(-5.*uDt)));
  o = d*wall(vUv);
}`,

// the drain takes a small picture of what is going down it. 256 of them, in turn, are the loop's memory.
crop: `
uniform sampler2D uDye;
void main(){ o = vec4(texture(uDye, C+(vUv-0.5)*0.15).rgb, 1.); }`,

// the lace: two chemicals, one feeding on the other (Gray-Scott). x is the way round the rim, y is outward.
// Near the rim it grows as a net with holes; further out it breaks into cells that divide.
lace: `
uniform sampler2D uRD; uniform vec2 uTx; uniform float uTime, uSeed, uDf, uDk, uLit; uniform vec3 uTouch;
float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
void main(){
  vec2 c = texture(uRD, vUv).rg;
  vec2 e = vec2(uTx.x,0.), n = vec2(0.,uTx.y);
  vec2 lap = -c + 0.13*(texture(uRD,vUv+e).rg + texture(uRD,vUv-e).rg) + 0.27*(texture(uRD,vUv+n).rg + texture(uRD,vUv-n).rg)
           + 0.05*(texture(uRD,vUv+e+n).rg + texture(uRD,vUv+e-n).rg + texture(uRD,vUv-e+n).rg + texture(uRD,vUv-e-n).rg);
  lap *= mix(0.68, 1.0, smoothstep(0., 0.85, vUv.y));                    // small cells at the rim, larger ones further out
  float a = vUv.x*6.28318;
  // holes, all the way out: a net of cells. Further out the holes drift (chaos and holes); the weather over it is mild
  // as the sky fills, the culture leaves holes for mazes: the cells join up, and fewer die
  float f = mix(0.0390, 0.0372, vUv.y) - 0.0050*uLit + uDf + 0.0008*sin(a*3.+uTime*0.021) + 0.0005*sin(a*7.-uTime*0.013) + 0.0004*sin(vUv.y*9.-uTime*0.05);
  float k = mix(0.0580, 0.0584, vUv.y) - 0.0008*uLit + uDk + 0.0004*sin(a*2.-uTime*0.017+1.);
  float r = c.r*c.g*c.g;
  vec2 v = c + vec2(lap.r - r + f*(1.-c.r), 0.5*lap.g + r - (f+k)*c.g);
  // on the beat the rim seeds it again, somewhere; a hand passing through clears it, and it grows back
  float sd = step(0.994, hash(vec2(floor(vUv.x*440.), uSeed)))*step(vUv.y,0.06);
  v.g = max(v.g, sd*0.45);
  float ev = floor(uTime*0.33);                                         // a patch dies every three seconds, somewhere
  vec2 pc = vec2(hash(vec2(ev,1.7)), 0.15+0.7*hash(vec2(ev,9.2)));
  vec2 dp = vec2(min(abs(vUv.x-pc.x), 1.-abs(vUv.x-pc.x))*6., vUv.y-pc.y);
  float age = fract(uTime*0.33);
  v = mix(v, vec2(1.,0.), 0.5*(1.-0.8*uLit)*exp(-dot(dp,dp)/0.0016)*smoothstep(0.,0.15,age)*smoothstep(0.6,0.3,age));
  // and the whole culture creeps outward, a little, all the time
  v = mix(v, texture(uRD, vUv-vec2(0., uTx.y*0.35)).rg, 0.025+0.03*uLit);
  vec2 dt = vec2(min(abs(vUv.x-uTouch.x), 1.-abs(vUv.x-uTouch.x))*6., vUv.y-uTouch.y);
  float wipe = uTouch.z*exp(-dot(dt,dt)/0.002);
  v = mix(v, vec2(1.,0.), wipe);
  o = vec4(clamp(v,0.,1.),0.,1.);
}`,

// what is going down the drain right now
display: `
uniform sampler2D uDye, uRD;
uniform float uTime, uBeats, uS, uHold, uSurge, uCursorOn, uDpr, uHeldSecs, uLoss, uEnd, uJelly, uWaltz;
uniform float uRead, uWhole, uFlash, uDepth, uFocus, uGaze, uHb, uLaceScale;
uniform vec4 uSky;                                    // the sky's box, in pixels
uniform vec4 uStar[25];                               // x, y, light (-1: not yet; 0: unlit; 1: lit, more while it flares), tint. 25th: the viewer
uniform float uStarMag[25]; uniform float uNova;      // seconds since the viewer became a star; below zero, they have not
uniform vec4 uLink[27]; uniform float uLinkOn[27];    // lines between stars, drawn in once both ends are lit
uniform vec4 uBorn;                                   // a star just lit: x, y (pixels), age in seconds, on
uniform vec4 uWords;                                  // the words' box, in pixels
uniform vec2 uSpot;                                   // where the glass is clear, this hold
uniform vec2 uPath[8]; uniform float uPathN, uGrow;   // the places you have found, in order: your path; the last still arriving
uniform vec2 uOther[8]; uniform float uOtherN;        // a path someone else found, if they sent it
uniform vec2 uLead;                                   // where the line from the tap arrives
uniform vec2 uTap, uCenter, uRes, uCursor;
${IMG_FN}
${STILL_FN}
float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
float hash1(float n){ return fract(sin(n*127.1+3.7)*43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}
float fbm(vec2 p){ float a = 0.5, v = 0.; for(int i=0;i<4;i++){ v += a*vnoise(p); p = p*2.03+17.; a *= 0.5; } return v; }
float seg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; return length(pa-ba*clamp(dot(pa,ba)/dot(ba,ba),0.,1.)); }
float lum(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }
float bit(float n, float k){ return step(1., mod(floor(n/k),2.)); }
// lub-dub
float beat(float ph){
  ph = fract(ph);
  float a = ph/0.10, a2 = (ph-1.)/0.10, b = (ph-0.30)/0.11;
  return exp(-a*a)+exp(-a2*a2)+0.6*exp(-b*b);
}
const vec3 BONE = vec3(0.95,0.91,0.82);
const vec3 GOLD = vec3(0.62,0.40,0.20);
const float LACE0 = 0.006, LACE1 = 0.24;   // the lace begins just off the rim and runs this far out
const float NR = 72.;      // flutes per basin unit

void main(){
  vec2 q = (gl_FragCoord.xy-uCenter)/uS;     // screen-aligned, in basin units, origin at the drain
  vec2 d = rot(q);                           // the same point in the basin's own turned frame
  float r = length(q);
  float aa = 1.5/uS;
  vec3 col = vec3(0.0012,0.0012,0.0015);
  // the lace parts round the words: a clearing with soft edges, so they sit in the piece, not beside it
  vec2 wc = 0.5*(uWords.xy+uWords.zw), wh = 0.5*(uWords.zw-uWords.xy);
  float rad = min(wh.x, wh.y)*0.9;
  vec2 dd = abs(gl_FragCoord.xy-wc)-(wh-rad);
  float sd = length(max(dd,0.))+min(max(dd.x,dd.y),0.)-rad;
  sd += (fbm(q*2.6+vec2(uTime*0.03,-uTime*0.02))-0.5)*0.06*uRes.y;
  float clear = mix(0.18, 1., smoothstep(-0.02*uRes.y, 0.13*uRes.y, sd));
  clear = mix(1., clear, smoothstep(R+0.01, R+0.10, r));
  {                                                   // and it thins where the sky is
    vec2 kc = 0.5*(uSky.xy+uSky.zw), kh = 0.5*(uSky.zw-uSky.xy);
    vec2 kd = abs(gl_FragCoord.xy-kc)-kh;
    float ks = length(max(kd,0.))+min(max(kd.x,kd.y),0.);
    clear *= mix(0.22, 1., smoothstep(-0.02*uRes.y, 0.10*uRes.y, ks));
  }

  // corona: lace grown on the rim. Threads follow the edges of the culture; signals run out along them on the beat.
  if(r > R-0.09-0.40*uEnd){                                              // the culture reaches in over the picture; at the end, all the way
    float rr = r-R;
    vec2 dir = q/r;
    vec2 lp = vec2(atan(q.y,q.x)/6.28318+0.5+uTime*0.0022, (abs(rr)-LACE0)/(LACE1*uLaceScale));   // it turns, it breathes, it beats; inside the rim it is its own mirror
    float v = texture(uRD, lp).g;
    vec2 gv = vec2(texture(uRD, lp+vec2(0.0006,0.)).g-texture(uRD, lp-vec2(0.0006,0.)).g, texture(uRD, lp+vec2(0.,0.01)).g-texture(uRD, lp-vec2(0.,0.01)).g);
    vec2 tn = normalize(gv+1e-5);                                           // across the thread, in lace space
    vec2 sn = normalize(vec2(-dir.y, dir.x)*tn.x + dir*tn.y);              // the same, on screen
    float relief = 0.55+0.45*dot(sn, normalize(vec2(-0.6, 0.8)));          // lit from the upper left
    float w = fwidth(v)*1.9+0.018;
    float thread = (1.-smoothstep(0.,w,abs(v-0.20))) + 0.6*(1.-smoothstep(0.,w,abs(v-0.31)));
    float body = smoothstep(0.16,0.34,v);
    float glint = smoothstep(0.78,1.,vnoise(q*330.+vec2(uTime*0.35,-uTime*0.22)))*smoothstep(0.6,1.,vnoise(q*41.-uTime*0.06));
    float pulse = 0.5+0.5*cos(6.28318*(uBeats*0.5-rr*1.2));                     // a slow swell that moves outward, never a flash
    float signal = smoothstep(0.78,1.,vnoise(vec2(lp.x*60., rr*8.-uBeats*0.35)));   // something travelling outward, faint
    float lobe = 0.10*cos(13.*atan(q.y,q.x)+uTime*0.012) + 0.05*cos(5.*atan(q.y,q.x)-uTime*0.008) + 0.04*uWaltz;
    float fall = smoothstep(-0.09,0.04,rr)*smoothstep(1.,0.45-0.3*uLoss,lp.y-lobe)*exp(-max(rr,0.)*(3.2-1.6*uLoss));
    float lace = (thread*(0.24+0.34*relief+0.09*pulse+0.22*signal*thread) + body*0.045 + thread*glint*0.5)*fall;
    lace *= 1.+0.35*uHb*smoothstep(0.11,0.,abs(rr));                       // the heart of it: the fine cells at the rim light on the beat
    // under it, what is left of the rays: fine hair
    float live = (1.-0.35*uHold)*(1.+0.45*uSurge)*(1.+0.5*uFlash)*(1.+0.9*uLoss)*(1.-0.85*uEnd);
    // near the rim the threads take the colour of the picture beneath them, so neither ends where the other begins
    vec3 under = texture(uDye, C+rot(dir*min(r, R-0.01))).rgb;
    vec3 tint = mix(mix(GOLD, BONE, smoothstep(0.,0.09,rr)), under*1.4+0.15, smoothstep(0.12,-0.06,rr));

  {

    float ma = fract(atan(q.y,q.x)/6.28318*12.+0.5)-0.5;
    float markw = abs(ma)*6.28318*r/12.;
    bez += 0.5*smoothstep(0.0012+aa*2.,0.0012,markw)*smoothstep(R+0.004,R+0.006,r)*smoothstep(R+0.012,R+0.010,r);
    float sheen = 0.6+0.6*max(0., dot(q/r, normalize(vec2(-0.6,0.8))));
    col = mix(col, BONE*0.30*sheen, bez*0.45);

  if(r < R+0.004){

    float L = 1.-smoothstep(0.,1.,uHold)*max(mix(0.24,1.,uFocus), win);
    // the glass gives under the hand: the flutes bow away from a press and spring back
    vec2 cq = q-(uCursor-uCenter)/uS;
    vec2 qj = q + cq*exp(-dot(cq,cq)/0.014)*uJelly*0.30;
    float fx = qj.x*NR, fi = floor(fx), s = fx-fi;              // s: position across one flute
    float tooth = hash1(fi);
    vec2 ql = vec2(mix(q.x, (fi+0.5+(s-0.5)*0.46)/NR, L), q.y+(tooth-0.5)*0.005*L);
    vec2 p = C+rot(ql);
    vec2 up1 = rot(vec2(0.,1.));

    vec3 c = mix(dye, still(p), 0.96*(1.-L));
    c = mix(c, c*c*(3.-2.*c), 0.58)*1.22;                          // more bite in the picture
    float pulse = beat(uBeats - length(p-uTap)*1.5);            // leaves the tap, arrives late at the drain

    float e = 3./1024.;
    vec2 gr = vec2(lum(texture(uDye,p+vec2(e,0.)).rgb)-lum(texture(uDye,p-vec2(e,0.)).rgb),

    vec3 n = normalize(vec3(-unrot(gr)*2.2, 0.09));

    c += BONE*pow(max(dot(n,Hh),0.),40.)*0.20*L;
    vec3 glow = vec3(0.);
    for(int k=0;k<8;k++){ float a = float(k)*0.7854+0.3; glow += texture(uDye, p+0.034*vec2(cos(a),sin(a))).rgb; }

    float lit = mix(1., 0.88+0.12*cos(6.28318*(s-0.30)), L);
    float seam = 1.-0.16*L*smoothstep(0.30,0.5,abs(s-0.5));

    {

        dd = min(dd, abs(length(q-uPath[i])-0.008*g));

      th = 0.45*smoothstep(0.0006+aa*2.,0.0006,dm) + 0.7*smoothstep(0.0008+aa*2.,0.0008,dd);

    float beacon = pow(uWaltz, 6.);                               // on the crest of the phase the pupil breathes light
    b += BONE*(beacon*0.22+0.08*uGaze)*exp(-rp*rp/0.004)*(1.-uEnd);

    col = mix(col, BONE*0.34, 0.8*smoothstep(0.0006+aa*2.,0.0006,ln));
    col = mix(col, BONE*0.55, 0.8*smoothstep(0.0030+aa*2.,0.0030,length(q-le)));

  // the spotlight: at the end the pupil's light turns to wherever your hand is. you can't hide.
  {

      float lit = min(s.z, 1.), flare = max(s.z-1., 0.);
      float b = 0.25+0.75*clamp((2.6-uStarMag[i])/4.2, 0., 1.);

      float sig = (1.2+1.3*b*lit+1.4*flare)*size;

      float halo = exp(-dpx/((4.+12.*b*lit)*size))*(0.22+0.35*flare);
      vec3 tint = tk < 0.5 ? BONE : tk < 1.5 ? GOLD*1.5 : tk < 2.5 ? vec3(0.74,0.86,1.0) : mix(BONE*1.3, GOLD*1.7, smoothstep(1.5, 7., dpx/size));
      float tw = 0.86+0.14*sin(uTime*(1.1+0.9*hash1(float(i)*3.1))+float(i)*2.1);
      sky += tint*(core*(0.10+1.4*lit) + halo*lit)*tw;
      if(tk > 2.5){
        if(lit <= 0.) sky += GOLD*1.5*smoothstep(2.,0.,abs(dpx-(9.+2.*sin(uTime*2.)))-0.5)*0.45;   // a place kept, breathing
        else sky += GOLD*1.7*exp(-dpx/(30.*size))*(0.30+0.22*sin(uTime*1.3))*lit;              // and taken: it radiates gold
      }
      if(i == 24 && uNova >= 0.){                                        // the supernova: one ring, spreading, thinning
        float rr0 = 10.+75.*uNova;
        sky += BONE*smoothstep(3.,0.,abs(dpx-rr0)-1.)*exp(-uNova/2.4)*0.55;
      }
    }
    for(int i=0;i<27;i++){
      float on = uLinkOn[i]; if(on <= 0.) continue;
      vec4 l = uLink[i];
      float dm = seg(gl_FragCoord.xy, l.xy, mix(l.xy, l.zw, on))/uDpr;
      sky += BONE*smoothstep(1.4,0.,dm-0.15)*0.17;
    }
    col += sky;
  }
  // a star just lit: a thread of the culture reaches out from the rim to it, and lets go
  if(uBorn.w > 0.5 && uBorn.z < 4.
     && all(greaterThan(gl_FragCoord.xy, min(uBorn.xy, uCenter)-0.3*uS)) && all(lessThan(gl_FragCoord.xy, max(uBorn.xy, uCenter)+0.3*uS))){
    vec2 st = uBorn.xy, dirs = normalize(st-uCenter);
    vec2 a = uCenter + dirs*(R+0.08)*uS;                                   // from the rim's edge
    vec2 ctrl = mix(a, st, 0.5) + vec2(-dirs.y, dirs.x)*length(st-a)*0.22; // bowed, never straight
    float prog = smoothstep(0., 1.6, uBorn.z), gone = smoothstep(2.2, 4., uBorn.z);
    float dm = 1e9; vec2 prev = a;
    for(int k=1;k<=14;k++){
      float t = float(k)/14.;
      if(t > prog) break;
      vec2 pt = mix(mix(a, ctrl, t), mix(ctrl, st, t), t);
      dm = min(dm, seg(gl_FragCoord.xy, prev, pt)); prev = pt;
    }
    float th = smoothstep(1.6, 0., dm/uDpr-0.2);
    float head = exp(-length(gl_FragCoord.xy-prev)/(5.*uDpr));
    col += GOLD*1.6*(th*0.35 + head*0.8)*(1.-gone);
  }

  o = vec4(max(col,0.),1.);
}`,

  // the hand: a ring that tightens as the picture comes clear; the arc is how long you have kept it there

  col = mix(col, vec3(0.80,0.77,0.70), 0.85*max(ringc,arc)*uCursorOn);

// ---- GL plumbing ----
function shader(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const vs = shader(gl.VERTEX_SHADER, VS);
function program(name){
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, COMMON + FS[name]));
  gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(name+': '+gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i=0;i<n;i++){ const nm = gl.getActiveUniform(p,i).name; u[nm] = gl.getUniformLocation(p,nm); }
  return { p, u };
}
let P;
try { P = Object.fromEntries(Object.keys(FS).map(k => [k, program(k)])); }
catch (e) { fail('Shader error: '+e.message); console.error(e); return; }

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());

gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function texture(filter, wrapS){
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrapS || gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}
function target(size, float=true){
  const tex = texture(gl.LINEAR);
  if (float) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, size, size, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else       gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0,0,size,size); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fbo, w:size, h:size };
}
function sheet(w, h){
  const tex = texture(gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fbo, w, h };
}

// ---- state ----
const H = 1/SIM;
const TAP = [0.5, 0.5+0.27];
const RETURN_SECONDS = 10;            // how long the loop remembers before it pours
const LAUNCH = Date.UTC(2026, 8, 29), DAVOS = Date.UTC(2027, 0, 18);
const BEAT_SECONDS = 1.6;             // ~38 bpm: a freediver's heart on a breath-hold
const SIGN_BEATS = 9;                 // each still has nine heartbeats
const READ_SECONDS = 1.6;             // one heartbeat kept in the clear place
const HOLD_AFTER = 220;               // ms: shorter is a tap, longer is a hold
const ROT = [1, 0];                   // the basin is turned so the tap points at the title; set in resize()
const OUTER = 0.50;                   // where the marks end, in basin units
const ss = (a,b,x) => { const t = Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const heart = (ph) => { ph -= Math.floor(ph); const a = ph/0.10, a2 = (ph-1)/0.10, b = (ph-0.30)/0.11;
  return Math.exp(-a*a)+Math.exp(-a2*a2)+0.6*Math.exp(-b*b); };

let simTime = 0, last = performance.now(), held = false;
let headF = 0, beats = 0, sign = 0, mixAB = 0, gph = 0, end = 0;
// how far along the one clock we are: 0 on the day it was published, 1 on the first day of Davos (?day=N to look ahead)
const dayParam = parseFloat(new URLSearchParams(location.search).get('day'));

let hb = 0, laceScale = 1;                   // the beat, and how far the lace has breathed out on it: the drawing and the wipe must agree
let sync = 0, shownSync = '';
const jelly = { x:0, v:0 };                  // a spring: pressed in, it overshoots on the way back
let intro = 4.5;                             // the first breaths: the picture is shown clear, then let go
let idle = 0, ghost = { on:false, t:0 };     // if no one touches it, a hand shows how

const stir = { x:0.5, y:0.5, vx:0, vy:0, px:null, py:null };
const pause = { p:0, A:[1,0,0,0], B:[1,0,0,0], flip:[1,1], seed:0, spot:[0,0], line:-1, kept:0, done:false, byKey:false };

const hand = { x:0, y:0, on:false, pressing:false, timer:0 };
const view = { w:1, h:1, cx:0, cy:0, S:1, dpr:1, box:[0,0,0,0], lead:[0,0] };

let imgTex = [];

// ---- the face: the viewer's own, if they allow it. One frame, poured into the loop, forgotten with the rest. ----
let faceTex = null, facePour = 0, faceHolds = 0, asked = false, seeing = false, meet = 0;
const ask = document.getElementById('ask');
function grade(cx){                 // the same grade as the stills: cool mono, a little gold in the light, dark at the edges
  const im = cx.getImageData(0, 0, 512, 512), d = im.data;

async function see(ev){
  ev.preventDefault();

  seeing = true; told('<b>looking</b>');
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'user', width:{ ideal:640 }, height:{ ideal:480 } }, audio:false });
    const v = document.createElement('video'); v.srcObject = stream; v.muted = true; v.playsInline = true; await v.play();
    await new Promise(r => setTimeout(r, 1100));                       // long enough to be looking at it
    const sz = Math.min(v.videoWidth, v.videoHeight);
    const cv = document.createElement('canvas'); cv.width = cv.height = 512;
    const cx = cv.getContext('2d', { willReadFrequently:true });
    cx.translate(512, 0); cx.scale(-1, 1);                            // as in a mirror
    cx.drawImage(v, (v.videoWidth-sz)/2, (v.videoHeight-sz)/2, sz, sz, 0, 0, 512, 512);
    stream.getTracks().forEach(t => t.stop()); v.srcObject = null; stream = null;   // the camera is off again here

    faceHolds = 2; compose(); meet = 4.5; focus = 1;
    if (!novaOn) { novaOn = true; nova = 0; novaPlay = play; save(); }   // the viewer becomes the last star

  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop());

const eye = document.getElementById('eye');
eye.addEventListener('click', see);
function told(html, ms){ ask.innerHTML = html; eye.classList.add('said'); clearTimeout(told.t); if (ms) told.t = setTimeout(() => { eye.classList.remove('said'); if (ms > 5000) eye.classList.remove('on'); }, ms); }

function step(dt){
  hb = heart(beats);
  gather();
  const Q = 0.038*(0.55 + 1.6*hb)*(1 + 2.6*surge)*(1 + 2*end);  // let go, and it floods back; at the end, the drain takes it
  const gT = beats/SIGN_BEATS; gph = gT-Math.floor(gT);
  sign = Math.floor(gT) % N;
  mixAB = ss(0.72, 1.0, gph);                               // the last breaths of one image are the first of the next
  const waltz = 0.5+0.5*Math.sin(2*Math.PI*beats/6);        // one slow phase, six beats long, that everything moves to
  const gamma = 0.011*Math.sin(Math.PI*gT)*(0.6+0.8*waltz);  // the drain turns one way, then the other, and leans into the phase
  const tap = [TAP[0] + 0.004*Math.sin(simTime*0.7), TAP[1] + 0.003*Math.sin(simTime*0.9+1)];

  let u = use(P.curl); bind(u.uVel, vel.read.tex); gl.uniform1f(u.uH, H); draw(curl);

  gl.uniform1f(u.uGamma, gamma); gl.uniform1f(u.uRelax, 0.9);

  const pour = facePour > 0 ? 2.6 : end > 0.02 ? 0 : 2.2*ss(0, 0.04, gph)*(1-ss(0.10, 0.18, gph))*(1-loss);   // the still arrives and lets go softly

// ---- one composition. Wide: the disc is cropped by the left edge and the words stand to its right.
// Tall: the disc is cropped by the top and the words stand under it. Either way the tap is turned to face them.
const RING = 0.470/0.395;             // the ring of cuts, in basin radii
function resize(){
  const { w, h, dpr } = layoutWords();
  const pw = Math.max(2, Math.round(w*dpr)), ph = Math.max(2, Math.round(h*dpr));
  if (canvas.width !== pw || canvas.height !== ph || !scene) {
    canvas.width = pw; canvas.height = ph;
    for (const t of [scene, softA, softB]) if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); }
    scene = sheet(pw, ph);
    softA = sheet(Math.ceil(pw/4), Math.ceil(ph/4)); softB = sheet(softA.w, softA.h);
  }
}
function layoutWords(){
  const w = window.innerWidth, h = window.innerHeight;

    Rb = 0.47*h; cy = 0.54*h;
    cx = Math.min(0.40*w, w-ww-40-RING*Rb-36);
    wx = cx+RING*Rb+36; wy = Math.max(0.12*h, cy-0.62*Rb-wh/2);
  } else {
    Rb = Math.min(0.47*w, (h-wh-70)/(RING+0.92));
    cx = 0.46*w; cy = 0.92*Rb;
    wx = Math.max(24, Math.min(w-ww-24, cx-0.35*Rb)); wy = cy+RING*Rb+52;
  }
  words.style.width = ww+'px';
  words.style.transform = `translate(${Math.round(wx)}px,${Math.round(wy)}px)`;
  const lead = [wx-14, wy+13];                       // just left of the title's first letter
  document.getElementById('lead').style.transform = `translate(${Math.round(lead[0])}px,${Math.round(lead[1])}px)`;
  document.getElementById('eye').style.transform = `translate(${Math.round(cx)}px,${Math.round(cy)}px)`;
  const turn = Math.atan2(lead[0]-cx, cy-lead[1]);
  ROT[0] = Math.cos(turn); ROT[1] = Math.sin(turn);

  if (w*h*dpr*dpr > 3.6e6) dpr = Math.sqrt(3.6e6/(w*h));
  Object.assign(view, { w, h, cx, cy, S:Rb/0.395, dpr, box:[wx-10, wy-6, wx+ww, wy+wh+6], lead });
  words.style.visibility = 'visible';
  // the sky: wide, it is the free corner below the words, past the lace; tall, the strip under them
  const wide = w > 1.3*h;
  // the sky: wide, the free corner below the words, past the lace; tall, the strip under them, or failing that the column beside them
  let box = wide ? [Math.max(wx-24, cx+1.32*Rb), wy+wh+30, w-28, h-26] : [24, wy+wh+22, w-24, h-20];
  const room = (b) => b[2]-b[0] >= 70 && b[3]-b[1] >= 70;
  if (!wide && !room(box)) {
    const right = [wx+ww+16, wy, w-20, h-20], left = [20, wy, wx-16, h-20];
    box = room(right) ? right : room(left) ? left : [w-150, h-150, w-24, h-24];
  }

function frame(now){
  try { tick(now); }

function tick(now){

  let want = 0;

}

// ---- hands: move stirs, a tap turns the page, a hold is stillness ----
const toBasin = (ev) => {

  const qx = (hand.x-view.cx)/view.S, qy = (view.cy-hand.y)/view.S;
  return [0.5+ROT[0]*qx-ROT[1]*qy, 0.5+ROT[1]*qx+ROT[0]*qy];
};
canvas.addEventListener('pointermove', (ev) => {
  const [x, y] = toBasin(ev); hand.on = true;
  if (stir.px !== null) {
    const k = 4.0, cap = 0.6;                       // the picture is a paste: it goes where the hand pushes it
    stir.vx += Math.max(-cap, Math.min(cap, (x-stir.px)*k));
    stir.vy += Math.max(-cap, Math.min(cap, (y-stir.py)*k));
  }
  stir.x = x; stir.y = y; stir.px = x; stir.py = y;
  const qx = (hand.x-view.cx)/view.S, qy = (view.cy-hand.y)/view.S, rr = Math.hypot(qx, qy)-0.395;
  if (rr > 0 && rr < 0.26*laceScale) { const tx = Math.atan2(qy, qx)/(2*Math.PI)+0.5+simTime*0.0022; touch.x = tx-Math.floor(tx); touch.y = (rr-0.006)/(0.24*laceScale); touch.z = 0.5; }
});

canvas.addEventListener('pointerdown', (ev) => {
  toBasin(ev); hand.on = true; hand.pressing = true;
  try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
  clearTimeout(hand.timer);
  hand.timer = setTimeout(() => { if (hand.pressing) setHeld(true); }, HOLD_AFTER);
});
canvas.addEventListener('pointerup', (ev) => {
  if (!hand.pressing) return;
  hand.pressing = false; clearTimeout(hand.timer);
  if (held) setHeld(false); else turnPage();
  if (ev.pointerType !== 'mouse') hand.on = false;
});
canvas.addEventListener('pointercancel', () => { hand.pressing = false; hand.on = false; clearTimeout(hand.timer); if (held) setHeld(false); });
canvas.addEventListener('contextmenu', (ev) => ev.preventDefault());

// the still for this hold: a partner from somewhere else in the loop, and a chance framing for each
function compose(){
  const rnd = (a, b) => a + Math.random()*(b-a);
  const frame = (zMax, turn) => { const z = rnd(1, zMax), m = (1-1/z)/2; return [z, rnd(-m, m), rnd(-m, m), rnd(-turn, turn)]; };
  {                                                   // the partner still: never within a tenth of the loop of one already held in this play
    const used = mem[play].filter(Boolean).map((m) => m.p), gap = Math.max(2, Math.floor(N/10));
    for (let n = 0; n < 40; n++) {
      pause.p = (sign + 3 + Math.floor(Math.random()*(N-6))) % N;
      if (used.every((u) => Math.min(Math.abs(u-pause.p), N-Math.abs(u-pause.p)) >= gap)) break;

  pause.face = faceHolds > 0; if (pause.face) { faceHolds--; pause.B = frame(1.15, 0.08); pause.flip = [1, 1]; }

  const hx = (hand.x-view.cx)/view.S, hy = (view.cy-hand.y)/view.S;

function turnPage(){          // begin dissolving into the next image now
  const gT = beats/SIGN_BEATS, gph = gT-Math.floor(gT);
  if (gph < 0.72) beats = (Math.floor(gT)+0.72)*SIGN_BEATS;
}
function setHeld(v){
  if (v === held) return;
  held = v;
  if (v) {
    holdStart = performance.now(); heldSecs = 0;
    compose();
  }
  else { surge = 1; pause.byKey = false; }
  document.body.classList.toggle('held', v);
}
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) { setHeld(true); pause.byKey = true; } }   // with no hand to seek with, the place finds you
  else if (e.code === 'ArrowRight') turnPage();

});
window.addEventListener('keyup', (e) => { if (e.code === 'Space') setHeld(false); });
window.addEventListener('blur', () => { hand.pressing = false; clearTimeout(hand.timer); setHeld(false); });

// r: keep fifteen seconds of the basin as a clip
let recording = false;

  if (recording || !canvas.captureStream || !window.MediaRecorder) return;
  const type = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  if (!type) return;
  recording = true;
  const chunks = [], rec = new MediaRecorder(canvas.captureStream(60), { mimeType:type, videoBitsPerSecond:16e6 });
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = 'veritas.' + (type.includes('mp4') ? 'mp4' : 'webm');
    a.click(); recording = false;

}

// ---- begin, once the stills are in ----
// ---- the sky ----
// Each play's constellation is drawn as a chart (east to the left, as it hangs in the sky), fitted into its own cell of the sky's box.
const starLight = PLAYS.map(() => new Float32Array(LINES));                  // 0 unlit, 1 lit; above 1 while a new one flares
const sky = { box:[0,0,0,0], key:'', star:new Float32Array(25*4).fill(-1), mag:new Float32Array(25), link:new Float32Array(27*4), linkOn:new Float32Array(27), px:[], cell:null, novaAt:[0,0] };
const skyEl = document.getElementById('sky');
PLAYS.forEach((P, k) => {
  for (let i = 0; i < LINES; i++) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'star'; b.dataset.play = k; b.dataset.i = i;
    b.setAttribute('aria-label', `a star: ${lineOf(i, k)}`);
    const on = () => { if (starLight[k][i] > 0) { recall = { play:k, line:i, snap:mem[k][i] || (mem[k][i] = snapNow(false)) }; hand.on = true; } };
    const off = () => { recall = null; };
    b.addEventListener('pointerenter', on); b.addEventListener('focus', on);
    b.addEventListener('pointerleave', off); b.addEventListener('blur', off);
    b.addEventListener('pointerdown', (ev) => { ev.preventDefault(); on(); clearTimeout(b.t); b.t = setTimeout(off, 4000); });   // a touch: it stays a moment
    skyEl.appendChild(b);
  }
  const c = document.createElement('p'); c.className = 'clue'; c.dataset.play = k; c.textContent = P.clue; skyEl.appendChild(c);
});
const novaEl = document.createElement('button'); novaEl.type = 'button'; novaEl.className = 'star'; novaEl.setAttribute('aria-label', "the last star: you can't hide.");
novaEl.addEventListener('pointerenter', () => { recall = { nova:true }; hand.on = true; }); novaEl.addEventListener('focus', () => { recall = { nova:true }; });
novaEl.addEventListener('pointerleave', () => { recall = null; }); novaEl.addEventListener('blur', () => { recall = null; });
novaEl.addEventListener('pointerdown', (ev) => { ev.preventDefault(); recall = { nova:true }; clearTimeout(novaEl.t); novaEl.t = setTimeout(() => { recall = null; }, 4000); });
skyEl.appendChild(novaEl);
const starEls = [...skyEl.querySelectorAll('.star')].slice(0, PLAYS.length*LINES), clueEls = [...skyEl.querySelectorAll('.clue')];
function layoutSky(box, wide){
  const key = box.join(',') + (wide ? 'w' : 't') + play;
  if (key === sky.key) return; sky.key = key; sky.box = box;
  const n = play+1, W = box[2]-box[0], Hh = box[3]-box[1], PAD = 14;
  // the sky is shared by the plays so far, cut whichever way leaves the squarest cells
  const stack = Math.min(W, Hh/n) >= Math.min(W/n, Hh);
  const cw0 = stack ? W : W/n, ch0 = stack ? Hh/n : Hh;
  const narrow = cw0 < 200 || ch0 < 120, LABEL = narrow ? 40 : 18;      // on a phone the clue wraps
  sky.cell = [];
  for (let k = 0; k < PLAYS.length; k++) {
    const kk = Math.min(k, n-1);
    const cell = stack ? [box[0], box[1]+Hh/n*kk, box[2], box[1]+Hh/n*(kk+1)] : [box[0]+W/n*kk, box[1], box[0]+W/n*(kk+1), box[3]];

    const side = Math.min(cw, ch)-PAD;
    sky.cell[k] = { cx: cell[0]+cw/2, cy: cell[1]+ch/2, s: Math.max(1, side/0.86), size: Math.max(0.45, Math.min(1.25, side/150)) };
    clueEls[k].style.width = cw+'px'; clueEls[k].style.transform = `translate(${Math.round(cell[0])}px,${Math.round(cell[3]-LABEL)}px)`;
    clueEls[k].classList.toggle('narrow', narrow);
  }
}
let shownK = -1, litFrac = 0, litAll = false;         // how much of the sky is lit: the culture grows faster and closer for it
function lightSky(dt){
  const fl = Math.exp(-dt/1.4);
  const lit = starLight.reduce((a, L) => a + L.reduce((b, v) => b + (v > 0 ? 1 : 0), 0), 0), all = PLAYS.length*LINES;
  const litHere = starLight[play].reduce((b, v) => b + (v > 0 ? 1 : 0), 0);
  if (lit !== shownK) {                                                   // the count, and the door: the proposal opens when the sky is full
    shownK = lit;
    document.querySelector('#prog .bar i').style.width = (150*litHere/LINES).toFixed(1)+'px';
  }
  litFrac = lit/all; litAll = starLight.some((L) => Array.from(L).every((v) => v > 0));   // one whole constellation is enough for the last star

  document.body.classList.toggle('nova', novaOn);
  const ease = 1-Math.exp(-dt/0.6);
  for (let k = 0; k < PLAYS.length; k++) clueEls[k].classList.toggle('show', !!recall && recall.play === k);
  for (let k = 0; k < PLAYS.length; k++) for (let i = 0; i < LINES; i++) {
    const L = starLight[k], j = k*LINES+i, m = mem[k][i], c = sky.cell && sky.cell[k];
    if (L[i] > 1) L[i] = 1 + (L[i]-1)*fl;
    starEls[j].classList.toggle('on', L[i] > 0 && !!m);
    if (!m || !c) { sky.star[j*4+2] = -1; continue; }                     // no line, no star: the constellation is made, not given
    const r = Math.hypot(m.spot[0], m.spot[1]), cl = r > 0.42 ? 0.42/r : 1;
    const tx = c.cx + m.spot[0]*cl*c.s, ty = c.cy - m.spot[1]*cl*c.s;

    if (!p) sky.px[k][i] = [tx, ty]; else { p[0] += (tx-p[0])*ease; p[1] += (ty-p[1])*ease; }
    const [x, y] = sky.px[k][i];
    if (Math.abs(x-(starEls[j].px||0)) > 0.3 || Math.abs(y-(starEls[j].py||0)) > 0.3) { starEls[j].px = x; starEls[j].py = y; starEls[j].style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px)`; }
    sky.star[j*4] = x*view.dpr; sky.star[j*4+1] = (view.h-y)*view.dpr;
    sky.star[j*4+2] = L[i];
    sky.star[j*4+3] = (i === WIPE_LINE ? 1 : (m.ord ?? i) === LINES-1 ? 2 : 0)*8 + c.size;   // the wipe's star is gold, the last found is ice
    sky.mag[j] = 2.3 - 0.3*(m.ord ?? i);                                  // the later it was found, the brighter

    if (Math.abs(sky.novaAt[0]-(novaEl.px||0)) > 0.3 || Math.abs(sky.novaAt[1]-(novaEl.py||0)) > 0.3) { novaEl.px = sky.novaAt[0]; novaEl.py = sky.novaAt[1]; novaEl.style.transform = `translate(${Math.round(sky.novaAt[0])}px,${Math.round(sky.novaAt[1])}px)`; }

      const pa = sky.px[k] && sky.px[k][order[q]], pb = sky.px[k] && sky.px[k][order[q+1]];
      if (!pa || !pb) { sky.linkOn[j] = 0; continue; }
      sky.link[j*4] = pa[0]*view.dpr; sky.link[j*4+1] = (view.h-pa[1])*view.dpr; sky.link[j*4+2] = pb[0]*view.dpr; sky.link[j*4+3] = (view.h-pb[1])*view.dpr;
      const want = starLight[k][order[q]] > 0 && starLight[k][order[q+1]] > 0;
      sky.linkOn[j] = want ? Math.min(1, sky.linkOn[j] + dt/2.2) : 0;
    }
  }
  if (novaOn && j < 27 && sky.px[novaPlay]) {                           // and it is joined to the last star found
    const order = orderOf(novaPlay), pa = sky.px[novaPlay][order[order.length-1]];
    if (pa) { sky.link[j*4] = pa[0]*view.dpr; sky.link[j*4+1] = (view.h-pa[1])*view.dpr; sky.link[j*4+2] = sky.novaAt[0]*view.dpr; sky.link[j*4+3] = (view.h-sky.novaAt[1])*view.dpr; sky.linkOn[j] = Math.min(1, sky.linkOn[j] + dt/2.2); j++; }
  }
  for (; j < 27; j++) sky.linkOn[j] = 0;
}

layoutWords();                                   // the words take their place before the stills are decoded
Promise.all(FRAMES.map((src) => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; })))

  restore();                                              // and what you left here last time is still here
