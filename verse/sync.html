<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veritas</title>
<link rel="icon" href="data:,">
<meta name="description" content="veritas: the web half of vanitas_veritas, one water with vanitas, the sink. The water is a machine, dreaming. Reach in, and it slips away.">
<style>
  :root { --bone:#e4dfd2; --gold:#c2a27a; --ink:#030304; --dim:#8a8d93;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; overflow:hidden; background:var(--ink); color:var(--dim); font:12.5px/1.75 var(--mono); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
  h1 { position:fixed; left:28px; top:22px; margin:0; font:400 20px/1.1 var(--mono); letter-spacing:.42em; text-transform:uppercase;
    color:var(--bone); pointer-events:none; }
  #code { position:fixed; left:28px; bottom:22px; margin:0; font:inherit; color:var(--dim); pointer-events:none; text-align:left;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 0 4px var(--ink), 0 0 2px var(--ink); transition:opacity .8s; }
  #code { font-size:11.5px; letter-spacing:.01em; color:rgba(138,141,147,.82); }
  #code #pr { color:var(--bone); opacity:.92; }
  #code .oref { color:var(--gold); }                                  /* a face from the sink: the visitor is the current dream */
  #turn { display:block; position:relative; height:1px; margin-top:9px; background:rgba(228,223,210,.10); }   /* one turn of the loop: fills until the words change */
  #turn::after { content:''; position:absolute; left:0; top:0; bottom:0; width:calc(var(--t, 0)*100%); background:rgba(228,223,210,.45); }
  #code.dry #turn { visibility:hidden; }                                   /* the words are the dream's; the code around them stays quiet */
  #code #grip { display:block; }
  #code .ln { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.55; }   /* two lines at most: the prompt, then the trace blended in */
  #code .tr { color:var(--bone); opacity:.48; }
  #dry { display:none; position:fixed; border:1px solid rgba(228,223,210,.30); border-radius:3.5%/4.6%; }
  body.nogpu #dry { display:block; }
  body.sink h1, body.sink #code { display:none; }                  /* in the stone: only the water */
  h1 { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }   /* the name is in the tab; the page shows only the water */
  body.doc #code { display:none; }                               /* the document shows the prompt beside the mirror */
  /* at vanitas, the camera's own place on the glass: held two seconds it looks once; the water itself never does */
  #eye { position:fixed; left:50%; bottom:5vh; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center;
    gap:10px; pointer-events:none; }
  #eye[hidden] { display:none; }
  #ring { width:56px; height:56px; border-radius:50%; border:1px solid rgba(228,223,210,.55); pointer-events:auto; touch-action:none; cursor:pointer;
    background:conic-gradient(rgba(228,223,210,.55) calc(var(--p, 0)*1turn), transparent 0); transition:box-shadow .2s; }
  #eye.look #ring { box-shadow:0 0 0 3px var(--gold), 0 0 24px var(--gold); }        /* the camera is open */
  #say { max-width:min(420px, 80vw); text-align:center; color:var(--bone); opacity:0; transition:opacity .25s; pointer-events:none;
    text-shadow:0 0 3px rgba(3,3,4,.9); }
  #eye.on #say { opacity:.9; }
  @media (max-width:600px) { h1 { left:16px; top:16px; font-size:16px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="A basin seen from above. Water runs from the tap to the drain, carrying a dream. Press to reach in; the space bar is the plug."></canvas>
<h1 id="title">veritas</h1>
<div id="dry"></div>
<pre id="code" class="dry"><span id="water">water = None</span><span id="grip"></span><span id="turn"></span></pre>
<div id="eye" hidden>
  <div id="ring" role="button" aria-label="hold for two seconds to lend your face to the next dream; let go to stop"></div><div id="say">hold to lend your face: one picture, never saved. the dream may look like you, and everyone watching sees it. let go to stop.</div>
</div>
<script>
(() => {
'use strict';
// veritas (sync.html): the web basin, one water with vanitas, the sink (sink == sync). The water is a machine dreaming: a spring (code/sink.py, on a GPU) writes a new prompt, dreams it, and walks the
// latent space to the next, frame by frame; every frame pours in at the tap and runs to the drain. No GPU, no water, no dream.
// Reach in, and the water under your hand goes where your hand goes, for a moment; then it slips through your fingers, down the drain.
const canvas = document.getElementById('c'), title = document.getElementById('title');
const waterEl = document.getElementById('water'), gripEl = document.getElementById('grip'), codeEl = document.getElementById('code'), dry = document.getElementById('dry');
const params = new URLSearchParams(location.search);
if (params.has('sink')) document.body.classList.add('sink');
if (params.has('doc')) document.body.classList.add('doc');
const SPRING_HOME = '', POINTER_HOME = 'https://kat-titter.github.io/vanitas-veritas/verse/spring.json';                           // the spring's public address, once it has one; until then, on the web, the water is off
let SPRING = params.has('spring') ? (params.get('spring') || 'feed/') : SPRING_HOME;
if (!SPRING && !params.get('img')) fetch(POINTER_HOME + '?t=' + Date.now(), { cache:'no-store' }).then((r) => r.json()).then((j) => { if (j && j.feed) SPRING = j.feed; }).catch(() => {});   // on either public address: where the spring is now (one pointer, which sink.py rewrites)
const SMALL = Math.min(innerWidth, innerHeight) < 600 || matchMedia('(pointer: coarse)').matches;
const SIM = 256, PI_N = SMALL ? 24 : 36, BX = 0.46, BY = 0.345;   // the basin: a rectangle, 4:3 like the dreams
let DYE = 1024, BIG = false;                       // the water's own resolution, set from the basin's size on screen
const TAP = [0.5, 0.5 + 0.27];

const view = { w:1, h:1, cx:0, cy:0, S:1, dpr:1 };
function layout(){
  const w = innerWidth, h = innerHeight; view.w = w; view.h = h; view.dpr = Math.min(2, devicePixelRatio || 1);
  const fit = params.has('sink') || params.has('doc') ? [1, 1] : w < 600 ? [0.94, 0.62] : [0.80, 0.74];   // in the stone the hole masks the edge; on the web, room for the words
  view.S = Math.min(fit[0]*w/(2*BX), fit[1]*h/(2*BY)); view.cx = w/2; view.cy = h/2;
  const hw = BX*view.S, hh = BY*view.S;
  Object.assign(dry.style, { left:`${view.cx - hw}px`, top:`${view.cy - hh}px`, width:`${2*hw}px`, height:`${2*hh}px` });
  Object.assign(codeEl.style, { left:`${view.cx - hw}px`, width:`${2*hw}px`, top:`${view.cy + hh + Math.min(28, (h/2 - hh)*0.35)}px`, bottom:'auto' });
  fitCode();
}
function fitCode(){                                   // two lines at most, as wide as the basin: the type shrinks to fit, to 10 px; past that a line ends in an ellipsis
  codeEl.style.fontSize = '';
  const base = parseFloat(getComputedStyle(codeEl).fontSize), w = codeEl.clientWidth, lines = [...waterEl.querySelectorAll('.ln')];
  const line = lines.length ? Math.max(...lines.map((l) => l.scrollWidth)) : waterEl.getBoundingClientRect().width;
  if (line > w && w > 0) codeEl.style.fontSize = Math.max(10, base*w/line*0.98) + 'px';
}
layout();
{ const px = 2*BX*view.S*view.dpr;              // a 4K screen gets the spring's full frames and water fine enough to show them
  DYE = SMALL ? 768 : px > 1800 ? 2048 : px > 1200 ? 1536 : 1024; BIG = px > 1400; }

const gl = canvas.getContext('webgl2', { alpha:false, antialias:false, depth:false, stencil:false, preserveDrawingBuffer:params.has('snap') });   // ?snap: the documents capture stills of the layers
if (!gl || !gl.getExtension('EXT_color_buffer_float')) {           // no GPU: the tap is dry
  document.body.classList.add('nogpu'); addEventListener('resize', layout); return;
}

const COMMON = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
out vec4 o;
const vec2  C  = vec2(0.5);
const vec2  B  = vec2(0.46, 0.345);   // the basin: half its width and height, a 4:3 rectangle like the dreams
const float RC = 0.035;   // the bowl's rounded corners
const float R  = 0.345;   // the reach of the drain's pull: the basin's short half
float sdBox(vec2 q){ vec2 d = abs(q)-B+RC; return length(max(d,0.)) + min(max(d.x,d.y),0.) - RC; }   // signed distance to the wall: below 0 inside
const float RD = 0.030;   // drain
const float SF = 0.034;   // tap footprint
const float SD = 0.030;   // drain footprint
float wall(vec2 p){ return 1.0 - smoothstep(-0.004, 0., sdBox(p-C)); }
bool inside(vec2 p){ return sdBox(p-C) < 0.; }
float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
float hash1(float n){ return fract(sin(n*127.1+3.7)*43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}
float lum(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }
`;
const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

const FS = {
curl: `
uniform sampler2D uVel; uniform float uH;
void main(){
  float L = texture(uVel, vUv-vec2(uH,0.)).y, Rr = texture(uVel, vUv+vec2(uH,0.)).y;
  float B = texture(uVel, vUv-vec2(0.,uH)).x, T  = texture(uVel, vUv+vec2(0.,uH)).x;
  o = vec4(((Rr-L)-(T-B))*0.5/uH, 0.,0.,1.);
}`,

// body forces: small eddies kept alive, the drain's vortex, the stream falling from the tap, and the hand
force: `
uniform sampler2D uVel, uCurl;
uniform float uH, uDt, uConf, uSwirl, uTime, uStream;
uniform vec2 uStirPos, uStirVel, uTap, uGrabVel;
uniform vec4 uGrab;                                   // the hand in the water: where, how hard it still grips, how wide the palm
uniform vec4 uRH[4]; uniform float uRG[4], uRN;       // hands in other basins: where, the push they give, how hard they grip
void main(){
  vec2 v = texture(uVel, vUv).xy;
  float cL = texture(uCurl, vUv-vec2(uH,0.)).x, cR = texture(uCurl, vUv+vec2(uH,0.)).x;
  float cB = texture(uCurl, vUv-vec2(0.,uH)).x, cT = texture(uCurl, vUv+vec2(0.,uH)).x;
  float cC = texture(uCurl, vUv).x;
  vec2 f = 0.5*vec2(abs(cT)-abs(cB), abs(cR)-abs(cL));
  f /= length(f)+1e-4; f *= uConf*cC; f.y *= -1.;
  v += f*uDt;
  // the drain: a Burgers vortex, fast round the hole and slow far from it
  vec2 d = vUv-C; float r2 = dot(d,d), r = sqrt(r2)+1e-5;
  vec2 th = vec2(-d.y, d.x)/r;
  float vt = uSwirl*(1.-exp(-r2/0.0016))/r;
  v += th*(vt-dot(v,th))*(1.-exp(-0.8*uDt))*smoothstep(R, R*0.45, r);
  // where the stream lands, the water churns: two small eddies that wander, turning opposite ways
  for (int k = 0; k < 2; k++) {
    float s = float(k)*2.-1.;
    vec2 e = vUv-uTap-0.018*vec2(sin(uTime*1.7+s*2.), cos(uTime*1.3+s))-vec2(s*0.012, 0.);
    float e2 = dot(e,e);
    v += s*vec2(-e.y, e.x)*uStream*exp(-e2/0.0005)*uDt*24.;
  }
  // a hand moving through the water pushes it
  vec2 s = vUv-uStirPos;
  v += uStirVel*exp(-dot(s,s)/0.0022);
  // a hand holding: the water under the palm goes where the hand goes, except between the fingers
  vec2 g = vUv-uGrab.xy; float gr = length(g);
  float fingers = mix(0.15, 1., smoothstep(0.2, 0.8, 0.5+0.5*cos(5.*atan(g.y, g.x)+0.6)));
  float m = uGrab.z*exp(-gr*gr/(uGrab.w*uGrab.w))*mix(1., fingers, smoothstep(0.35, 0.95, gr/uGrab.w));
  v = mix(v, uGrabVel, m*(1.-exp(-30.*uDt)));
  for (int i = 0; i < 4; i++) {                       // the same water, touched from another basin
    if (float(i) >= uRN) break;
    vec2 e = vUv-uRH[i].xy; float e2 = dot(e,e);
    v += uRH[i].zw*exp(-e2/0.0022);
    v = mix(v, vec2(0.), uRG[i]*exp(-e2/0.0036)*(1.-exp(-30.*uDt)));
  }
  o = vec4(v*wall(vUv),0.,1.);
}`,

advect: `
uniform sampler2D uVel, uSrc; uniform float uDt, uDiss;
void main(){
  vec2 p = vUv - uDt*texture(uVel, vUv).xy;
  o = texture(uSrc, p)*exp(-uDiss*uDt)*wall(vUv);
}`,

// divergence, minus what the tap adds and the drain takes
diverge: `
uniform sampler2D uVel; uniform float uH, uQ, uQd; uniform vec2 uTap;
void main(){
  float L = texture(uVel, vUv-vec2(uH,0.)).x, Rr = texture(uVel, vUv+vec2(uH,0.)).x;
  float B = texture(uVel, vUv-vec2(0.,uH)).y, T  = texture(uVel, vUv+vec2(0.,uH)).y;
  float div = ((Rr-L)+(T-B))*0.5/uH;
  vec2 a = vUv-uTap, b = vUv-C;
  float src = uQ/(3.14159*SF*SF)*exp(-dot(a,a)/(SF*SF)) - uQd/(3.14159*SD*SD)*exp(-dot(b,b)/(SD*SD));
  o = vec4(div-src,0.,0.,1.);
}`,

pressure: `
uniform sampler2D uP, uDiv; uniform float uH;
void main(){
  float pC = texture(uP, vUv).x;
  vec2 l=vUv-vec2(uH,0.), r=vUv+vec2(uH,0.), b=vUv-vec2(0.,uH), t=vUv+vec2(0.,uH);
  float pL = inside(l)?texture(uP,l).x:pC, pR = inside(r)?texture(uP,r).x:pC;
  float pB = inside(b)?texture(uP,b).x:pC, pT = inside(t)?texture(uP,t).x:pC;
  o = vec4((pL+pR+pB+pT - uH*uH*texture(uDiv,vUv).x)*0.25,0.,0.,1.);
}`,

project: `
uniform sampler2D uP, uVel; uniform float uH;
void main(){
  float pC = texture(uP, vUv).x;
  vec2 l=vUv-vec2(uH,0.), r=vUv+vec2(uH,0.), b=vUv-vec2(0.,uH), t=vUv+vec2(0.,uH);
  float pL = inside(l)?texture(uP,l).x:pC, pR = inside(r)?texture(uP,r).x:pC;
  float pB = inside(b)?texture(uP,b).x:pC, pT = inside(t)?texture(uP,t).x:pC;
  vec2 v = texture(uVel, vUv).xy - vec2(pR-pL, pT-pB)*0.5/uH;
  o = vec4(v*wall(vUv),0.,1.);
}`,

// the dream is the pigment: carried by the water, re-forming out of the newest frame, freshest where the tap pours it in.
// Under a gripping hand it stops re-forming: what you hold is the moment you reached in.
dye: `
uniform sampler2D uVel, uDye, uImgA, uImgB;
uniform float uDt, uMix, uPour, uTapPour, uFade, uDrainR;
uniform vec2 uTap; uniform vec4 uGrab;
vec3 img(vec2 p){
  vec2 g = (p-C)/(2.*B) + 0.5;                            // the whole frame, edge to edge
  return mix(texture(uImgA,g).rgb, texture(uImgB,g).rgb, uMix);   // the frame as the spring graded it
}
void main(){
  vec2 p = vUv - uDt*texture(uVel, vUv).xy;
  vec4 d = texture(uDye, p);
  float r = length(vUv-C);
  d.rgb *= exp(-uFade*uDt);
  d.rgb *= mix(1., exp(-5.*uDt), smoothstep(RD*uDrainR, RD*0.5, r));      // and down it goes: when the water stops, the drain widens its pull
  vec2 g = vUv-uGrab.xy; float held = uGrab.z*exp(-dot(g,g)/(uGrab.w*uGrab.w));
  vec2 a = vUv-uTap; float fresh = exp(-dot(a,a)/(SF*SF*5.));
  float rate = uPour + uTapPour*fresh;
  d.rgb = mix(d.rgb, img(vUv), (1.-exp(-rate*uDt))*smoothstep(RD, 0.10, r)*(1.-held));
  o = d*wall(vUv);
}`,

// what you see: the water through fluted glass, flat under your hand; the drain, where light goes and does not come back
display: `
uniform sampler2D uDye;
uniform vec2 uCenter, uRes, uCursor, uTapQ;
uniform float uS, uTime, uCursorOn, uHold, uGrip, uWater, uPlug, uDrip, uGlass;
uniform vec4 uRQ[4]; uniform float uRN;          // other hands: where (basin units), grip, and 1 if the hand is at the sink
uniform vec4 uBub[16]; uniform float uBs[16];       // uBs: each bubble's own seed, for its wobble and the way it tears                              // soap bubbles on the water: centre, radius, how present (they swell slowly, then pop)
const vec3 BONE = vec3(0.95,0.91,0.82);
const float NR = 72.;      // flutes per basin unit
void main(){
  vec2 q = (gl_FragCoord.xy-uCenter)/uS;     // basin units, origin at the drain
  float r = length(q), aa = 1.5/uS;
  vec3 col = vec3(0.0012,0.0012,0.0015);
  float sd = sdBox(q);
  if (sd < 0.004) {
    vec2 hq = q-(uCursor-uCenter)/uS;
    float pool = smoothstep(0.045+0.05*uGrip, 0.012, length(hq))*uCursorOn*uHold;   // under the hand, the glass lies flat
    float L = (1.-pool*smoothstep(0., -0.08, sd))*uGlass;   // uGlass 0: the water without its ribbed glass and wet light
    float fx = q.x*NR, fi = floor(fx), s = fx-fi, tooth = hash1(fi);
    vec2 ql = vec2(mix(q.x, (fi+0.5+(s-0.5)*0.46)/NR, 0.14*L), q.y+(tooth-0.5)*0.002*L);   // ribbed glass: the dream reads through it
    { float rl = length(ql); ql += ql/max(rl, 1e-4)*0.00085/max(rl, RD*0.9); }    // light bent round the hole
    float rimL = 0., film = 0., men = 0.;                                                   // through a bubble the dream swells and bends: you see a form, barely
    for (int i = 0; i < 16; i++) { vec4 bb = uBub[i]; if (bb.z <= 0.) continue;
      vec2 dq = ql-bb.xy; float an = atan(dq.y, dq.x), sd_ = uBs[i];
      float wob = 1. + 0.14*sin(2.*an + sd_*6.3 + uTime*0.55) + 0.08*sin(3.*an + sd_*17. - uTime*0.4) + 0.05*sin(5.*an + sd_*29. + uTime*0.9);   // never round: a glob that wobbles
      float t = length(dq)/(bb.z*wob);
      if (bb.w < 0.) {                                                            // popping as goo: the skin sags, oozes out in a few thick strands, and melts back into the water
        float k = -bb.w, gone = 1. - k, ease = gone*gone*(3. - 2.*gone);          // slow to start, slow to finish
        if (t < 1.) ql = bb.xy + dq*mix(1., mix(0.38, 1., ease), 1. - t*t);       // the dome slumps back into the picture
        float tear = smoothstep(0.1, 0.9, 0.5 + 0.5*sin(an*3. + sd_*40. + gone*1.2)*sin(an*2. - sd_*23.));
        men += k*0.55*smoothstep(0.4, 0., abs(t - 1.1 - 0.08*ease));               // the ring of the surface, relaxing
        rimL += 0.6*k*tear*smoothstep(0.2 + 0.18*ease, 0., abs(t - 1. - 0.1*ease)); // the old skin, soft and sagging, barely moving
        for (int j = 0; j < 2; j++) {                                             // strands in 10 sectors: a few ooze out a little way, thick at the root, and soften as they melt
          float n = 10., sec = floor((an + 3.14159)*n/6.28318), h = fract(sin(sec*12.99 + sd_*78.23 + float(j)*31.7)*43758.5);
          if (h < 0.55) continue;
          vec2 dir = vec2(cos((sec + 0.5 + (h - 0.75)*0.5)/n*6.28318 - 3.14159), sin((sec + 0.5 + (h - 0.75)*0.5)/n*6.28318 - 3.14159));
          vec2 a0 = dir*bb.z*0.9, a1 = dir*(0.95 + (0.3*h + 0.1*float(j))*ease)*bb.z;
          vec2 pa = dq - a0, ba = a1 - a0; float hh = clamp(dot(pa, ba)/max(dot(ba, ba), 1e-8), 0., 1.);
          float dd = length(pa - ba*hh), sz = bb.z*(0.05 + 0.06*fract(h*7.3))*mix(1., 0.55, hh)*(0.8 + 0.7*ease);
          rimL += 0.8*k*smoothstep(sz*1.3, 0., dd); }
        continue; }
      if (t < 1.) { ql = bb.xy + dq*mix(mix(1., 0.38, bb.w), 1., t*t*t); film = max(film, bb.w*(1.-t*t)); }   // a dome of the dream itself, swollen
      else if (t < 1.3) ql -= dq/max(length(dq), 1e-4)*bb.z*0.05*bb.w*(1.3-t);                                   // the surface pulled up round it
      men += bb.w*smoothstep(0.32, 0., abs(t-1.1));                                                        // the meniscus: a soft dark ring where the water curves down
      rimL += bb.w*(0.55*smoothstep(0.16, 0., abs(t-0.93)) + 0.4*smoothstep(0.35, 0., abs(t-0.7))*smoothstep(-0.2, 0.6, dot(normalize(dq+1e-5), vec2(-0.6,0.8)))); }   // a soft rim and a catch-light, lit by the dream's own colour
    vec2 p = C+ql;
    vec3 c = clamp(texture(uDye, p).rgb, 0., 1.);
    c = mix(c, c*c*(3.-2.*c), 0.25);
    { float fall = smoothstep(RD*3.6, RD*1.05, length(q));             // it reddens as it falls in
      c = mix(c, vec3(lum(c))*vec3(1.25,0.48,0.30), 0.40*fall); }
    // wet light on the moving surface
    float e = 3./1024.;
    vec2 gr = vec2(lum(texture(uDye,p+vec2(e,0.)).rgb)-lum(texture(uDye,p-vec2(e,0.)).rgb),
                   lum(texture(uDye,p+vec2(0.,e)).rgb)-lum(texture(uDye,p-vec2(0.,e)).rgb));
    vec3 n = normalize(vec3(-gr*2.2, 0.09));
    vec3 Hh = normalize(normalize(vec3(-0.45,0.62,0.65))+vec3(0.,0.,1.));
    c += BONE*pow(max(dot(n,Hh),0.),40.)*0.22*mix(0.4, 1., L);
    vec3 glow = vec3(0.);

  let u = use(P.curl); bind(u.uVel, vel.read.tex); gl.uniform1f(u.uH, H); draw(curl);
  u = use(P.force); bind(u.uVel, vel.read.tex); bind(u.uCurl, curl.tex);
  gl.uniform1f(u.uH, H); gl.uniform1f(u.uDt, dt); gl.uniform1f(u.uConf, 0.01); gl.uniform1f(u.uTime, simTime);
  gl.uniform1f(u.uSwirl, 0.0006*(0.4 + 0.6*Math.max(water, left))*(1 + 0.8*gulp + 5*drainAmt)*(plug ? 0.3 : 1)); gl.uniform1f(u.uStream, 0.15*water*(1 + flood));
  gl.uniform2f(u.uStirPos, stir.x, stir.y); gl.uniform2f(u.uStirVel, stir.vx, stir.vy); gl.uniform2f(u.uTap, tap[0], tap[1]);
  gl.uniform4f(u.uGrab, hand.u, hand.v, grip, 0.06); gl.uniform2f(u.uGrabVel, hand.vx, hand.vy);
  others(); gl.uniform4fv(u['uRH[0]'], RH); gl.uniform1fv(u['uRG[0]'], RG); gl.uniform1f(u.uRN, rn);
  draw(vel.write); vel.swap(); stir.vx = stir.vy = 0;
  u = use(P.advect); bind(u.uVel, vel.read.tex); bind(u.uSrc, vel.read.tex); gl.uniform1f(u.uDt, dt); gl.uniform1f(u.uDiss, 0.35);
  draw(vel.write); vel.swap();
  u = use(P.diverge); bind(u.uVel, vel.read.tex); gl.uniform1f(u.uH, H); gl.uniform1f(u.uQ, Q); gl.uniform1f(u.uQd, Qd);
  gl.uniform2f(u.uTap, tap[0], tap[1]); draw(dvg);
  u = use(P.pressure); gl.uniform1f(u.uH, H);
  for (let i = 0; i < PI_N; i++) { unit = 0; bind(u.uP, prs.read.tex); bind(u.uDiv, dvg.tex); draw(prs.write); prs.swap(); }
  u = use(P.project); bind(u.uP, prs.read.tex); bind(u.uVel, vel.read.tex); gl.uniform1f(u.uH, H); draw(vel.write); vel.swap();
  u = use(P.dye); bind(u.uVel, vel.read.tex); bind(u.uDye, dye.read.tex); bind(u.uImgA, live.A); bind(u.uImgB, live.B);
  gl.uniform1f(u.uDt, dt); gl.uniform1f(u.uMix, live.mix); gl.uniform1f(u.uPour, water*(0.05 + 0.3*Math.pow(0.5 + 0.5*Math.sin(simTime*2*Math.PI/60 - 1.2), 2))); gl.uniform1f(u.uTapPour, 0.5*water);
  gl.uniform1f(u.uFade, 0.015 + 0.01*(1-water) + 0.18*(1-water)*(1-left)); gl.uniform1f(u.uDrainR, 1.6 + 7*drainAmt); gl.uniform2f(u.uTap, tap[0], tap[1]); gl.uniform4f(u.uGrab, hand.u, hand.v, grip, 0.06);
  draw(dye.write); dye.swap();
  flood *= Math.exp(-dt/2.5); gulp *= Math.exp(-dt/1.5);
  simTime += dt;
}

// soap bubbles, a cauldron's worth: they come up from the basin (small, faint, then sharp as they reach the surface), bloom over half a minute
// while the swirl carries them toward the drain, then pop: at the end of their life, at the drain, as the water drains, or under a finger.
// Only while the water runs; never more than sixteen.
const NB = 16, BUB = new Float32Array(NB*4), BS = new Float32Array(NB), bubs = []; let nextBub = 0, lastBub = 0;
const vents = [0, 1, 2].map(() => ({ x:(Math.random()*2-1)*BX*0.6, y:(Math.random()*2-1)*BY*0.6, a:Math.random()*6.283 }));   // a cauldron: bubbles keep coming up where it is hottest
const POP = 3.2;                                      // a gooey pop: about three seconds to melt back
function popBub(b, t){ if (b.pop) return; b.pop = t;
  const dl = Math.hypot(b.x, b.y) || 1;                              // a small splash where it broke
  stir.x = 0.5 + b.x; stir.y = 0.5 + b.y; stir.vx += 0.03*b.x/dl + 0.012*(Math.random() - 0.5); stir.vy += 0.03*b.y/dl + 0.012*(Math.random() - 0.5); }
function popAt(u, v){ const t = performance.now()/1000; let hit = false;
  bubs.forEach((b) => { if (!b.pop && Math.hypot(u-0.5-b.x, v-0.5-b.y) < b.r*1.1) { popBub(b, t); hit = true; } }); return hit; }
function blow(){
  const t = performance.now()/1000, dt = Math.min(0.1, t - (lastBub || t)); lastBub = t;
  vents.forEach((v) => { v.a += (Math.random() - 0.5)*dt; v.x = Math.max(-BX*0.7, Math.min(BX*0.7, v.x + Math.cos(v.a)*0.004*dt)); v.y = Math.max(-BY*0.7, Math.min(BY*0.7, v.y + Math.sin(v.a)*0.004*dt)); });
  if (BUBBLES && t > nextBub && bubs.length < NB && water > 0.5) {                    // a simmer: mostly small and quick, now and then a big slow one; often a glob of two or three
    const R = 0.015 + 0.14*Math.pow(Math.random(), 2.2), v = Math.random() < 0.7 ? vents[Math.floor(Math.random()*3)] : null;
    const x = v ? v.x + (Math.random() - 0.5)*0.08 : (Math.random()*2-1)*(BX-R)*0.85, y = v ? v.y + (Math.random() - 0.5)*0.08 : (Math.random()*2-1)*(BY-R)*0.85;
    const life = 5 + 70*R + Math.random()*10, n = Math.random() < 0.5 ? 1 + (Math.random() < 0.5 ? 1 : 0) : 0;
    bubs.push({ x, y, R, r:0, born:t, life, pop:0, seed:Math.random() });
    for (let k = 0; k < n && bubs.length < NB; k++) { const r2 = R*(0.3 + 0.5*Math.random()), a2 = Math.random()*6.283;
      bubs.push({ x:x + Math.cos(a2)*(R + r2)*0.8, y:y + Math.sin(a2)*(R + r2)*0.8, R:r2, r:0, born:t + Math.random()*1.5, life:life*(0.5 + 0.5*Math.random()), pop:0, seed:Math.random() }); }
    nextBub = t + 0.3 + Math.random()*0.9; }
  BUB.fill(0); BS.fill(0);
  for (let i = bubs.length - 1; i >= 0; i--) { const b = bubs[i], age = t - b.born, a = age/b.life;
    if (!b.pop) {                                                       // carried: a slow turn round the drain, a slower pull into it
      const d = Math.hypot(b.x, b.y) || 1, w = 0.012*water + 0.004 + 0.06*drainAmt, pull = 0.0015 + 0.03*drainAmt;   // draining: round and into the drain
      const nx = b.x - (b.y*w + b.x/d*pull)*dt, ny = b.y + (b.x*w - b.y/d*pull)*dt; b.x = nx; b.y = ny;
      if (a >= 1 || d < 0.045 || (water < 0.3 && left < 0.25 && Math.random() < dt*0.25)) popBub(b, t); }   // no water, no bubbles: they pop as it drains
    if (b.pop && t - b.pop > POP) { bubs.splice(i, 1); continue; } }
  bubs.forEach((b, i) => { BS[i] = b.seed; const age = Math.max(0, t - b.born), a = Math.min(1, age/b.life);
    const rise = Math.min(1, age/Math.min(7, b.life*0.25)), up = rise*rise*(3 - 2*rise);          // surfacing: the first seven seconds
    const bloom = 1 - Math.pow(1 - Math.min(1, a/0.6), 3);
    b.r = b.R*(0.12 + 0.88*Math.max(up*0.55, bloom));
    if (b.pop) { const k = Math.min(1, (t - b.pop)/POP), m = k*k*(3 - 2*k); BUB.set([b.x, b.y, b.r*(1 + 0.18*m), -(1 - m)], i*4); }
    else BUB.set([b.x, b.y, b.r, 0.08 + 0.92*up], i*4); });
}
function render(){
  const pw = Math.round(view.w*view.dpr), ph = Math.round(view.h*view.dpr);
  if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
  blow(); const d = view.dpr, u = use(P.display); bind(u.uDye, dye.read.tex); gl.uniform4fv(u['uBub[0]'], BUB); gl.uniform1fv(u['uBs[0]'], BS);
  gl.uniform2f(u.uCenter, view.cx*d, (view.h-view.cy)*d); gl.uniform2f(u.uRes, pw, ph); gl.uniform1f(u.uS, view.S*d);
  gl.uniform2f(u.uCursor, hand.x*d, (view.h-hand.y)*d); gl.uniform1f(u.uCursorOn, hand.on ? 1 : 0);
  gl.uniform2f(u.uTapQ, TAP[0]-0.5, TAP[1]-0.5); gl.uniform1f(u.uTime, simTime);
  gl.uniform1f(u.uGlass, GLASS); gl.uniform1f(u.uHold, holdAmt); gl.uniform1f(u.uGrip, grip); gl.uniform1f(u.uWater, water); gl.uniform1f(u.uPlug, plugAmt); gl.uniform1f(u.uDrip, drip);
  gl.uniform4fv(u['uRQ[0]'], RQ); gl.uniform1f(u.uRN, rn);
  draw(null);
}

let lastText = '';
let turnShown = -1;
function words(){
  const tt = turn.at ? Math.min(1, (performance.now() - turn.at)/turn.len) : 0;
  if (Math.abs(tt - turnShown) > 0.002) { turnShown = tt; codeEl.style.setProperty('--t', tt.toFixed(3)); }
  const t = water > 0.5 && live.prompt ? `water = dream("${live.prompt}")` : 'water = None';
  if (t !== lastText) {                               // two lines at most, rebuilt only when the words change
    lastText = t;
    if (water > 0.5 && live.prompt) {                  // the prompt on one line, the second prompt blended into it (after '~') on the next
      const [a, b] = live.prompt.split(' ~ '), mk = (cls, txt) => { const e = document.createElement('span'); e.className = cls; e.textContent = txt; return e; };
      waterEl.textContent = '';
      const face = a.endsWith(' --oref you'), l1 = mk('ln', 'water = dream("'), pr = mk('', face ? a.slice(0, -11) : a); pr.id = 'pr';
      l1.append(pr); if (face) l1.append(' ', mk('oref', '--oref you')); l1.append(b ? '' : '")'); waterEl.append(l1);
      if (b) { const l2 = mk('ln', '~ '); l2.append(mk('tr', b), '")'); waterEl.append(l2); } }
    else waterEl.textContent = t;
    codeEl.classList.toggle('dry', !(water > 0.5 && live.prompt));
    fitCode(); }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(1/30, Math.max(0, (now-last)/1000)); last = now;
  holdAmt += ((hand.down ? 1 : 0)-holdAmt)*(1-Math.exp(-dt/0.25));
  plugAmt += ((plug ? 1 : 0)-plugAmt)*(1-Math.exp(-dt/0.15));
  if (dt > 0) step(dt);
  render(); words(); send(false);
  nextFrame(frame);
}
addEventListener('resize', layout);
window.__snap = (q) => canvas.toDataURL('image/jpeg', q || 0.82);
window.__basin = { get t(){ return simTime; }, get water(){ return water; }, get seq(){ return live.seq; }, get grip(){ return grip; }, get prompt(){ return live.prompt; }, get have(){ return live.have; }, get others(){ return net.remote.size; }, get net(){ return net.socks.filter((x) => x.open).length; } };
const nextFrame = params.has('snap') ? (f) => setTimeout(() => f(performance.now()), 16) : requestAnimationFrame;   // ?snap runs on timers, so stills render even off screen
nextFrame(frame);
netStart();
})();
</script>
